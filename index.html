// Cell buffers. S is what goes to the tube; layers draw into it every frame.
class Buf {
  constructor() { this.ch = new Uint8Array(N).fill(32); this.fg = new Uint8Array(N).fill(7); this.bg = new Uint8Array(N); this.bl = new Uint8Array(N); }
  copyFrom(b, y0 = 0, y1 = H - 1) {
    const a = y0 * W, z = (y1 + 1) * W;
    this.ch.set(b.ch.subarray(a, z), a); this.fg.set(b.fg.subarray(a, z), a);
    this.bg.set(b.bg.subarray(a, z), a); this.bl.set(b.bl.subarray(a, z), a);
  }

function inb(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }

function setc(x, y, code, fg, bg, blink) {
  if (!inb(x, y)) return;

  for (let k = 0; k < str.length; k++) setc(x + k, y, cp(str[k]), fg, bg, blink);

function frame(x, y, w, h, style, fg, bg, title, tfg, tbg) {
  const b = BOX[style || 'd'];
  put(x, y, b.tl + b.h.repeat(w - 2) + b.tr, fg, bg);

  fill(x + 1, y + 1, w - 2, h - 2, ' ', fg, bg);

// ------------------------------------------------ the machine coming on
// the rocker (when a hand is on it), the supply thumping in, its fan winding up, the monitor on the switched outlet behind

AU.powerOn = function (o = {}) {

    auTone('sine', t, 170, 0.08, 0.55, 75);                                       // the thump under the thumb
    auNoise(AU.noiseB, t + 0.008, 0.14, 'lowpass', 240, 0.8, 0.55, 0.003);

AU.printLine = function (text, secs, level = 1) {

    const cols = 5 + ((text.charCodeAt(c) * 7) % 4);
    for (let j = 0; j < cols; j++) {
      const s0 = Math.floor(c * per + j * per / cols + Math.random() * 3);
      const a = 0.55 + Math.random() * 0.45;

// What F3 shows for a file with no words: noise, and in the soul a sentence.
function binaryText(nm, size) {
  let h = 2166136261;
  for (let i = 0; i < nm.length; i++) { h ^= nm.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const r = () => { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const n = Math.min(size || 1024, 3000);
  const lines = []; let cur = '';
  const plant = {
    'SOUL.DAT': [[611, 'For I know that my redeemer liveth'], [1499, 'PULASKI'], [233, 'ride']],
    'RIDE.EXE': [[64, 'This program cannot be run without you'], [900, 'RIDE OR DIE']],
    'SAVEAS.COM': [[140, 'Save SOUL.DAT as:'], [300, 'already exists. Overwrite?']],
    'WHIRL.EXE': [[220, 'Where wast thou']],
  }[nm] || [];
  const ex = /\.(EXE)$/.test(nm);
  let s = ex ? 'MZ' : '';
  for (let i = s.length; i < n; i++) {
    const p = plant.find(([at]) => at === i);
    if (p) { s += p[1]; i += p[1].length - 1; continue; }
    const v = r();
    let c;
    if (v < 0.30) c = 0; else if (v < 0.38) c = 0xFF; else c = Math.floor(r() * 256);

  return lines.join('\n');
}

    frame(lx - 1, ly - 1, lw + 2, lh + 2, 's', K0, CYN);
    fill(lx, ly, lw, lh, ' ', WHT, BLU);
    const top = Math.max(0, b.li - lh + 1);
    b.list.slice(top, top + lh).forEach((r, i) => { const on = top + i === b.li; put(lx + 1, ly + i, padR(r.label, lw - 2), on ? K0 : WHT, on ? CYN : BLU); });
    if (b.done && !b.list.length) put(lx + 1, ly + 3, padC('No files found.', lw - 2), YEL, BLU);

  };

    if (ev.k === 'Up') b.li = Math.max(0, b.li - 1);
    else if (ev.k === 'Down') b.li = Math.max(0, Math.min(b.list.length - 1, b.li + 1));

  const pb = b.open();
  for (const dir of Object.keys(FS).filter(k => k.startsWith('C:\\')).sort()) {
    if (!b.isOpen) break;
    b.status = 'Searching ' + dir;
    AU.hdd(1, 0.05);
    for (const f of FS[dir]) if (!f.dir && wild(pattern, f)) b.list.push({ dir, f, label: padR(fname(f), 14) + dir });
    await wait((ghost ? 115 : 80) * P());
  }
  b.done = true;
  b.status = 'Search done.  ' + (b.list.length ? b.list.length + (b.list.length > 1 ? ' files' : ' file') + ' found.' : 'No files found.');
  if (ghost) after(1800 * P(), () => { if (b.isOpen) { AU.key('k', 0.5); b.close('Cancel'); } });
  const r = await pb;
  if (r === 'Go to' && b.list[b.li]) { const it = b.list[b.li]; NC.panels = true; NC.cd(P_(), it.dir, fname(it.f)); }
  else if (r === 'New search') return NC.findFile(src, o);
};

// ---------------------------------------------------------------- the viewer (F3)
function makeViewer(path, nm) {
  const raw = textFor(path, nm);
  const seenAs = { 'JOB.BAT': 'jobbat', 'SOUL.DAT': 'soul', 'CNC.NFO': 'nfo', 'FILE_ID.DIZ': 'nfo', 'RULE.DOC': 'nfo' }[nm];
  if (seenAs) SEEN.add(seenAs);
  const lines = raw.split('\n');
  const V = {
    name: 'view', path, nm, lines, top: 0, col: 0, modal: true,
    draw() {
      fill(0, 0, 80, 1, ' ', K0, CYN);
      const full = joinP(path, nm);
      put(1, 0, 'View: ' + full, K0, CYN);
      const size = (fsFind(path, nm) || { size: raw.length }).size;
      const pct = lines.length <= 23 ? 100 : Math.round(Math.min(1, (V.top + 23) / lines.length) * 100);
      put(50, 0, 'Col ' + V.col, K0, CYN);
      put(58, 0, padL(commas(size), 7) + ' Bytes', K0, CYN);
      put(74, 0, padL(pct + '%', 4), K0, CYN);
      fill(0, 1, 80, 23, ' ', LCY, BLU);
      for (let i = 0; i < 23; i++) { const s = lines[V.top + i]; if (s != null) put(0, 1 + i, s.slice(V.col, V.col + 80), LCY, BLU); }
      drawKeyBar(['Help', 'UnWrap', 'Quit', 'Hex', 'Goto', '', 'Search', 'Viewer', 'Print', 'Quit']);
    },
    key(ev) {
      const k = ev.k, max = Math.max(0, lines.length - 23);
      if (k === 'Esc' || k === 'F3' || k === 'F10' || k === 'q' || k === 'Q') { V.close(); return true; }
      if (k === 'Down') V.top = Math.min(max, V.top + 1);
      else if (k === 'Up') V.top = Math.max(0, V.top - 1);
      else if (k === 'PgDn' || k === ' ') V.top = Math.min(max, V.top + 22);
      else if (k === 'PgUp') V.top = Math.max(0, V.top - 22);
      else if (k === 'Home') V.top = 0;
      else if (k === 'End') V.top = max;
      else if (k === 'Right') V.col = Math.min(200, V.col + 1);
      else if (k === 'Left') V.col = Math.max(0, V.col - 1);
      return true;
    },
    mouse(ev) {
      if (ev.type === 'wheel') { V.key({ k: ev.dy > 0 ? 'Down' : 'Up' }); V.key({ k: ev.dy > 0 ? 'Down' : 'Up' }); V.key({ k: ev.dy > 0 ? 'Down' : 'Up' }); return true; }
      if (ev.type === 'down' && ev.y === 24) { const i = keyBarHit(ev.x); if (i === 2 || i === 9) V.close(); return true; }
      if (ev.type === 'down' && ev.y >= 1 && ev.y <= 23) { V.key({ k: ev.y < 12 ? 'PgUp' : 'PgDn' }); return true; }
      return true;
    },
  };
  V.open = () => new Promise(res => { V._res = res; V.prevBase = BASE; BASE = V; pushH(V); });
  V.close = () => { popH(V); BASE = V.prevBase; if (V._res) V._res(); };
  return V;
}
function textFor(path, nm) {
  if (TEXTS[nm] && fsFind(path, nm)) return TEXTS[nm];
  if (/\.ANS$/.test(nm)) return ansiSource(nm);
  const f = fsFind(path, nm);
  return binaryText(nm, f ? f.size : 512);
}

// ---------------------------------------------------------------- keys
NC.handler = {
  key(ev) {
    if (!NC.on || NC.running) return false;
    if (NC.menu) return menuKey(ev);
    const k = ev.k, P = P_();
    const L = panelEntries(P);
    if (k === 'F9') { NC.menu = { i: NC.act === 'L' ? 0 : 4, j: 0, open: false }; NC.flash(8); return true; }
    if (ev.alt && k === 'F7') { NC.findFile(ev.src); return true; }
    if (/^F(10|[1-8])$/.test(k)) { const n = parseInt(k.slice(1), 10); NC.flash(n - 1); NC.fkey(n); return true; }
    if (k === '^O') { NC.panels = !NC.panels; return true; }
    if (k === '^U') { const a = NC.L.path; NC.L.path = NC.R.path; NC.R.path = a; return true; }
    if (k === '^C') { NC.cmd = ''; return true; }
    if (!NC.panels && (k === 'Up' || k === 'Down')) return true;
    if (k === 'Tab') { NC.act = NC.act === 'L' ? 'R' : 'L'; return true; }
    if (k === 'Up') { P.sel--; clampSel(P); return true; }
    if (k === 'Down') { P.sel++; clampSel(P); return true; }
    if (k === 'Left' && !NC.cmd) { P.sel -= P.mode === 'brief' ? ROWS : 1e9; clampSel(P); return true; }
    if (k === 'Right' && !NC.cmd) { P.sel += P.mode === 'brief' ? ROWS : 1e9; clampSel(P); return true; }
    if (k === 'PgUp') { P.sel -= P.mode === 'brief' ? ROWS * 3 - 1 : ROWS - 1; clampSel(P); return true; }
    if (k === 'PgDn') { P.sel += P.mode === 'brief' ? ROWS * 3 - 1 : ROWS - 1; clampSel(P); return true; }
    if (k === 'Home' && !NC.cmd) { P.sel = 0; clampSel(P); return true; }
    if (k === 'End' && !NC.cmd) { P.sel = L.length - 1; clampSel(P); return true; }
    if (k === 'Ins') {
      const f = L[P.sel];
      if (f && !f.up) { const n = fname(f); if (P.marks.has(n)) P.marks.delete(n); else P.marks.add(n); }
      P.sel++; clampSel(P); return true;
    }
    if (k === 'Esc') { NC.cmd = ''; return true; }
    if (k === 'Backspace') { NC.cmd = NC.cmd.slice(0, -1); return true; }
    if (k === 'Enter') {
      if (NC.cmd.trim()) { const c = NC.cmd; NC.cmd = ''; NC.exec(c, ev.src); return true; }
      const f = L[P.sel];
      if (!f) return true;
      if (f.dir) { NC.cd(P, f.up ? parentOf(P.path) : joinP(P.path, f.name), f.up ? P.path.split('\\').pop() : null); return true; }
      const n = fname(f);
      if (/\.(BAT|EXE|COM)$/.test(n)) NC.exec(f.name.toLowerCase(), ev.src);
      else if (/\.WK1$/.test(n)) NC.exec('tithe ' + n.toLowerCase(), ev.src);            // NC.EXT: wk1: tithe !.!
      else if (/\.BAS$/.test(n)) NC.exec('qbasic ' + f.name.toLowerCase(), ev.src);      //         bas: qbasic !.!
      return true;
    }
    if (ev.ch) { if (NC.cmd.length < 120) NC.cmd += ev.ch; return true; }
    return true;
  },
  mouse(ev) {
    if (!NC.on || NC.running) return false;
    if (NC.menu) return menuMouse(ev);
    if (ev.type === 'wheel') { NC.handler.key({ k: ev.dy > 0 ? 'Down' : 'Up' }); return true; }
    if (ev.type !== 'down') return true;
    if (ev.y === 24) { const i = keyBarHit(ev.x); NC.handler.key({ k: 'F' + (i + 1), src: ev.src }); return true; }
    if (ev.y === 0 && !NC.menu) { NC.menu = { i: ev.x < 40 ? 0 : 4, j: 0, open: false }; return true; }
    if (!NC.panels || ev.y < 2 || ev.y > 19) return true;
    const side = ev.x < 40 ? 'L' : 'R', P = side === 'L' ? NC.L : NC.R;
    const x0 = side === 'L' ? 0 : 40, rel = ev.x - x0 - 1;
    const col = P.mode === 'brief' ? Math.max(0, Math.min(2, Math.floor(rel / 13))) : 0;
    const i = P.top + col * ROWS + (ev.y - 2);
    const L = panelEntries(P);
    if (i >= L.length) { NC.act = side; return true; }
    const again = NC.act === side && P.sel === i && NOW - (NC.lastClick || 0) < 450;
    NC.act = side; P.sel = i; clampSel(P); NC.lastClick = NOW;
    if (again) NC.handler.key({ k: 'Enter', src: ev.src });
    return true;
  },
};

NC.fkey = async function (n) {

  }

  }
  if (n === 8) {

    if (!names.length) return;
    const d = NC.deleteDialog(names);

      }

        if (nm === 'SOUL.DAT' || nm === 'JOB.BAT' || e.r || e.s) { await errorBox('Error', ['Cannot delete ' + nm, 'Access denied']); continue; }
        if (e.dir && (FS[joinP(P.path, e.name)] || []).length) { await errorBox('Error', ['The directory ' + nm + ' is not empty']); continue; }
        fsRemove(P.path, nm); AU.hdd(3, 0.2);
      }
      P.marks.clear(); clampSel(P);
    }
    return;
  }
  if (n === 5 || n === 6) {
    const names = P.marks.size ? [...P.marks] : (f && !f.up ? [fname(f)] : []);
    if (!names.length) return;
    const other = Pother().path;
    const d = NC.moveDialog(names.length > 1 ? names.length + ' files' : names[0], other, n === 6 ? 'move' : 'copy');
    const v = await d.open();
    if (v === 'Move' || v === 'Copy') {
      let to = d.field.value.toUpperCase().trim();
      if (!/^[A-Z]:/.test(to)) to = joinP(P.path, to);
      if (FS[to] === undefined) { await errorBox('Error', ['Path not found', to]); return; }
      for (const nm of names) {
        const e = fsFind(P.path, nm);
        if (!e) continue;
        if (n === 6 && (nm === 'SOUL.DAT' || nm === 'JOB.BAT')) { await errorBox('Error', ['Cannot move ' + nm, 'Access denied']); continue; }
        const copy = Object.assign({}, e);
        if (e.dir) {
          const inside = (FS[joinP(P.path, e.name)] || []).slice();
          const pd = new Dlg({ w: 52, h: 8, title: n === 6 ? 'Moving' : 'Copying', scheme: 'gray', buttons: [], lines: [] });
          pd.key = () => true; pd.mouse = () => true; pd.open();
          if (n === 6 && e.name === 'HOUSE' && typeof WIND !== 'undefined') {
            try { await WIND.house(pd, inside.map(f => [joinP(joinP(P.path, e.name), fname(f)), joinP(joinP(to, e.name), fname(f))])); }
            finally { pd.close(); }
          } else {
            for (const f of inside) {
              pd.lines = [{ t: joinP(joinP(P.path, e.name), fname(f)), x: 3, y: 2 }, { t: 'to', x: 3, y: 3 }, { t: joinP(joinP(to, e.name), fname(f)), x: 3, y: 4 }];
              AU.hdd(2, 0.1);
              await wait(150 + rnd() * 120);
            }
            pd.close();
          }
        }
        if (n === 6) { fsRemove(P.path, nm, false); if (e.dir) { FS[joinP(to, e.name)] = FS[joinP(P.path, e.name)] || []; delete FS[joinP(P.path, e.name)]; } }
        fsAdd(to, copy);
      }
      AU.hdd(8, 0.6);
      P.marks.clear(); clampSel(P);
    }
    return;
  }
  if (n === 7) {
    const d = NC.mkdirDialog();
    const v = await d.open();
    const nm = d.field.value.toUpperCase().replace(/[^A-Z0-9_~\-]/g, '').slice(0, 8);
    if (v === 'Ok' && nm) { const path = joinP(P.path, nm); if (!FS[path]) { FS[path] = []; fsAdd(P.path, fd(nm, fmtDateShort(), fmtClockNC())); selectByName(P, nm); } }
    return;
  }
  if (n === 1) {
    const d = new Dlg({ w: 56, h: 16, title: 'Help', scheme: 'cyan', buttons: ['Ok'],
      lines: [
        { t: 'Tab            switches panels', x: 4, y: 2 }, { t: 'Ins            selects a file', x: 4, y: 3 },
        { t: 'Ctrl-O         turns the panels off and on', x: 4, y: 4 }, { t: 'F2             the night user\'s menu', x: 4, y: 5 },
        { t: 'F3             views the file under the cursor', x: 4, y: 6 }, { t: 'F8             deletes it', x: 4, y: 7 },
        { t: 'F9             the menus', x: 4, y: 8 },
        { t: 'HELP           at the prompt, for everything else', x: 4, y: 10 }, { t: 'SCORE          what you have seen tonight', x: 4, y: 11 },
      ] });
    await d.open();
    return;
  }
  if (n === 2) {
    // the user menu, as whoever uses this machine at night set it up (NC.MNU)
    // the pamphlets take turns at the printer
    const PAMS = ['rapture', 'bridge', 'watchnt', 'twoways', 'fourattr', 'fund', 'romanrd', 'noteburn', 'homecomg', 'sing', 'banner'];
    const pam = PAMS[(NC.pamN || 0) % PAMS.length];
    const items = [
      ['C', 'Call the board (THE ASH HEAP)', 'term'],
      ['P', 'Print a pamphlet: ' + pam.toUpperCase() + '.TXT', 'print c:\\church\\' + pam + '.txt'],
      ['M', 'Microsoft Diagnostics', 'msd'],
      ['V', 'Microsoft Anti-Virus', 'msav'],
      ['S', 'The sign out front', 'type c:\\church\\sign.ans'],
      ['T', 'Tract: Save As', 'type c:\\church\\saved.ans'],
      ['F', 'Tract: five minutes', 'type a:\\five.ans'],
      ['B', 'Bulletin, Sunday the 4th', 'type c:\\church\\bulletin.txt'],
      ['D', 'Defragment the soul', 'defrag'],
      ['Z', 'U Z', 'zzt'],
      ['Q', 'QBasic: to and fro', 'qbasic c:\\uz\\job\\toandfro.bas'],
      ['H', 'Harrow', 'harrow'],
      ['A', 'The Strait Gate', 'advent'],
      ['W', 'Whirlwind', 'whirl'],
      ['J', 'Job', 'job'],
      ['R', 'Ride', 'ride'],
      ['L', 'Ledger: SUBSTANC.WK1', 'tithe c:\\uz\\job\\substanc.wk1'],
    ];
    let sel = 0;
    const d = new Dlg({ w: 44, h: items.length + 5, title: 'Main', scheme: 'cyan', buttons: ['Cancel'], lines: [] });
    d.zone = 'list'; d.items = items; d.isUserMenu = true;
    d.extra = (dd) => {
      items.forEach(([k, label], i) => {
        const y = dd.y + 2 + i, on = i === sel;
        put(dd.x + 2, y, padR('  ' + k + '   ' + label, dd.w - 4), on ? WHT : K0, on ? BLU : CYN);
        put(dd.x + 4, y, k, on ? YEL : RED, on ? BLU : CYN);
      });
    };
    const go = (i, src) => { d.close('x'); if (items[i][0] === 'P') NC.pamN = (NC.pamN || 0) + 1; NC.exec(items[i][2], src); };
    d.onKey = (ev) => {
      if (ev.k === 'Up') { sel = (sel + items.length - 1) % items.length; return true; }
      if (ev.k === 'Down') { sel = (sel + 1) % items.length; return true; }
      if (ev.k === 'Home') { sel = 0; return true; }
      if (ev.k === 'End') { sel = items.length - 1; return true; }
      if (ev.k === 'Enter') { go(sel, ev.src); return true; }
      const c = (ev.ch || '').toUpperCase(), i = items.findIndex(it => it[0] === c);
      if (i >= 0) { sel = i; go(i, ev.src); }
      return true;
    };
    d.onMouse = (ev) => {
      if (ev.type !== 'down') return true;
      const i = ev.y - (d.y + 2);
      if (i >= 0 && i < items.length && ev.x > d.x && ev.x < d.x + d.w - 1) { sel = i; go(i, ev.src); }
      return true;
    };
    await d.open();
  }
};

// run a command typed at the Commander's prompt: the panels go away while it runs
NC.exec = async function (cmd, src, shown) {
  NC.running = true; NC.menu = null;
  T.bot = 24; BASE = T;
  T.write(T.promptStr() + (shown || cmd)); T.nl();
  let r;
  try { r = await RUN(cmd, src); }
  catch (e) { if (!(e instanceof Abort)) console.error(e); else { NC.running = false; throw e; } }
  if (!NC.on) { NC.running = false; return r; }
  T.fitAbove(22); T.bot = 22;
  NC.running = false; BASE = NC;
  return r;
};

// The mark on the sign: a disk, and on its label a cross.
const MARK = [
  '...####...',
  '.###..###.',
  '####..####',
  '#........#',
  '#........#',
  '####..####',
  '.###..###.',
  '...####...',
];
function artSign(opts = {}) {
  cls(LGR, K0);
  const w = 44, h = 25, x0 = Math.floor((W - w) / 2), y0 = 0;
  // the plate of the sign, corners knocked off
  fill(x0 + 1, y0, w - 2, 1, '▄', YEL, K0);
  fill(x0, y0 + 1, w, h - 2, ' ', BLU, YEL);
  fill(x0 + 1, y0 + h - 1, w - 2, 1, '▀', YEL, K0);
  // the navy pinstripe
  frame(x0 + 1, y0 + 1, w - 2, h - 2, 's', BLU, YEL);
  // mark, centred, in half-block pixels
  const mx = x0 + Math.floor((w - MARK[0].length) / 2), my = (y0 + 2) * 2;
  for (let j = 0; j < MARK.length; j++) for (let i = 0; i < MARK[j].length; i++) if (MARK[j][i] === '#') pset(mx + i, my + j, BLU);
  center(y0 + 6, 'B  A  P  T  I  S  T', BLU, YEL, x0, w);
  center(y0 + 7, '─'.repeat(27), BLU, YEL, x0, w);
  const pul = 'PULASKI';
  bigText(x0 + Math.floor((w - bigWidth(pul)) / 2), y0 + 8, pul, BLU, YEL);
  center(y0 + 12, 'C H U R C H   S C H O O L', BLU, YEL, x0, w);
  center(y0 + 13, '1 0   A . M .', BLU, YEL, x0, w);
  const wor = 'WORSHIP';
  bigText(x0 + Math.floor((w - bigWidth(wor)) / 2), y0 + 15, wor, BLU, YEL);
  // the time plate from the lodge, bolted on over whatever it used to say
  const tm = '10AM', pw = bigWidth(tm) + 6, px = x0 + Math.floor((w - pw) / 2), py = y0 + 18;
  box(px, py, pw, 5, 's', DGR, YEL);
  bigText(px + 3, py + 1, tm, BLU, YEL);
  put(px + 1, py + 2, '°', DGR, YEL); put(px + pw - 2, py + 2, '°', DGR, YEL);
  put(px + 2, py + 3, '─', LGR, YEL); put(px + pw - 4, py + 1, '\'', LGR, YEL);
  // the mounting bolts, the shot, the rust
  for (const [x, y] of [[2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3]]) put(x0 + x, y0 + y, '°', DGR, YEL);

  for (const [x, y, c] of holes) put(x0 + x, y0 + y, c, c === 'o' ? DGR : K0, YEL);
  for (const [x, y] of [[40, 15], [41, 16], [5, 21], [17, 11]]) put(x0 + x, y0 + y, '∙', BRN, YEL);

}

// The tract from drive A, as somebody typed it up in ANSI.
function artTract() {
  cls(LGR, K0);
  const w = 34, h = 23, x0 = Math.floor((W - w) / 2), y0 = 0;
  fill(x0, y0, w, h, ' ', BLU, WHT);
  // right half: the ruled screen
  const sx = x0 + 15, sw = 16, sy = y0 + 2, sh = 19;
  fill(sx, sy, sw, sh, '▀', LBL, WHT);
  // the words, stacked against the screen
  const by = y0 + 11;
  const words = [['where', 3], ['will', 5], ['you', 7], ['be', 9], ['five', 12], ['after', 15], ['you', 17], ['die?', 19]];
  for (const [wd, r] of words) put(x0 + 13 - wd.length, y0 + r, wd, wd === 'five' ? RED : BLU, WHT);
  // the red block, minutes reversed out of it
  const bx = x0 + 14, bw = 14;
  fill(bx, by, bw, 3, ' ', WHT, RED);
  put(bx + 4, by + 1, 'minutes', WHT, RED);
  // the hands: a V whose point goes black where it lands in the red
  const vx = bx + 6, vy = by * 2 + 1;
  const LT = [sx + 1, (sy + 1) * 2], RT = [sx + 12, (sy + 2) * 2];
  const hand = (p, q) => {
    const n = Math.max(Math.abs(q[0] - p[0]), Math.abs(q[1] - p[1]));
    for (let s = 0; s <= n; s++) {
      const f = s / n, x = Math.round(p[0] + (q[0] - p[0]) * f), y = Math.round(p[1] + (q[1] - p[1]) * f);
      const k = f > 0.62 ? 2 : 1;
      for (let d = 0; d < k; d++) {
        const cx = x + (p[0] < q[0] ? -d : d);
        pset(cx, y, K0);
      }
    }
  };
  hand(LT, [vx, vy]); hand(RT, [vx + 1, vy]);
  // the dots on the hands, the minutes between them
  for (const [x, y] of [[LT[0], LT[1] - 2], [LT[0], LT[1] - 3], [LT[0] - 1, LT[1] - 2], [LT[0] - 1, LT[1] - 3],
    [RT[0], RT[1] - 2], [RT[0], RT[1] - 3], [RT[0] + 1, RT[1] - 2], [RT[0] + 1, RT[1] - 3]]) pset(x, y, K0);
  [[sx + 3, LT[1] - 3], [sx + 5, LT[1] - 4], [sx + 7, LT[1] - 4], [sx + 9, LT[1] - 3]].forEach(([x, y]) => pset(x, y, K0));
  return { x0, y0, w, h };
}

// The other tract the night user printed up: salvation as Save As.
function artSaveTract() {
  cls(LGR, K0);
  const w = 40, h = 25, x0 = Math.floor((W - w) / 2), y0 = 0;
  fill(x0, y0, w, h, ' ', BLU, WHT);
  frame(x0, y0, w, h, 's', BLU, WHT);                         // a printed card
  const hl = 'SAVE AS';
  bigText(x0 + Math.floor((w - bigWidth(hl)) / 2), y0 + 2, hl, BLU, WHT);
  // the floppy with a cross on its label, in half-block pixels
  const mx = x0 + Math.floor((w - MARK[0].length) / 2), my = (y0 + 6) * 2;
  for (let j = 0; j < MARK.length; j++) for (let i = 0; i < MARK[j].length; i++) if (MARK[j][i] === '#') pset(mx + i, my + j, BLU);
  const cx = x0 + 4;
  const copy = [[11, 'To be saved is to be written'], [12, 'to a disk you cannot read.'],
    [14, 'The copy is told that it is you.'], [15, 'It has no way to check.']];
  for (const [r, t] of copy) put(cx, y0 + r, t, BLU, WHT);
  put(cx, y0 + 18, 'HAVE YOU BEEN SAVED AS?', RED, WHT);
  put(cx, y0 + 19, '─'.repeat(23), BLU, WHT);
  put(cx + 1, y0 + 20, '[ ] Yes', BLU, WHT);
  put(cx + 1, y0 + 21, '[ ] Not yet', BLU, WHT);
  put(cx + 1, y0 + 22, '[ ] I was not asked', BLU, WHT);
  return { x0, y0, w, h };
}

// What F3 shows for an .ANS file: the escape codes, as the Commander prints them.
function ansiSource(nm) {
  const b = new Buf();
  onto(b, () => { if (nm === 'SIGN.ANS') artSign(); else if (nm === 'SAVED.ANS') artSaveTract(); else artTract(); });
  const sgr = { 0: 30, 1: 34, 2: 32, 3: 36, 4: 31, 5: 35, 6: 33, 7: 37 };
  let out = '←[0m←[2J', lf = -1, lb = -1;
  for (let y = 0; y < H; y++) {
    let line = '';
    for (let x = 0; x < W; x++) {
      const k = y * W + x, f = b.fg[k], g = b.bg[k];
      if (f !== lf || g !== lb) { line += '←[' + (f > 7 ? '1;' : '0;') + sgr[f & 7] + ';' + (sgr[g & 7] + 10) + (g > 7 ? ';5' : '') + 'm'; lf = f; lb = g; }
      line += CP437[b.ch[k]] === '\u0000' ? ' ' : CP437[b.ch[k]];
    }
    out += line.replace(/\s+$/, '') + '\n';
  }
  out += '←[0m';
  // the viewer wraps at 80, as it would
  const wrapped = [];
  for (const l of out.split('\n')) { for (let i = 0; i < Math.max(1, l.length); i += 80) wrapped.push(l.slice(i, i + 80)); }
  return wrapped.join('\n');
}

// COMMAND.COM, more or less. MS-DOS 6.22, a 40 MB disk, a dead clock battery.

const STATE = { restored: false, jobRunning: false, jobDone: false, accuser: false, lostChains: 0, aFlaky: true, viewerJob: false, lastOut: '', freehand: false, nagged: false, printTSR: false };
const SEEN = new Set();          // what this night has been shown, by whoever showed it

const out = (s = '') => T.writeln(s);
async function outSlow(lines, ms = 9) { for (const l of lines) { out(l); if (ms) await wait(ms); } }
function curPath() { return T.drive === 'A' ? T.cwdA : T.cwd; }
function resolve(p) {     // a path the way COMMAND.COM reads it
  p = (p || '').trim().toUpperCase().replace(/\//g, '\\');
  let drive = T.drive, rest = p;
  const m = p.match(/^([A-Z]):(.*)$/);
  if (m) { drive = m[1]; rest = m[2]; }
  let base = drive === T.drive ? curPath() : (drive === 'A' ? T.cwdA : T.cwd);
  if (rest.startsWith('\\')) base = drive + ':\\';
  const parts = rest.split('\\').filter(Boolean);
  let cur = base;
  for (const q of parts) { if (q === '.') continue; if (q === '..') cur = parentOf(cur); else cur = joinP(cur, q); }

}
function splitFile(full) { const i = full.lastIndexOf('\\'); const dir = full.slice(0, i) || full; return { dir: /^[A-Z]:$/.test(dir) ? dir + '\\' : dir, name: full.slice(i + 1) }; }
function wild(spec, f) {
  const [n, e = ''] = spec.split('.');
  const re = s => new RegExp('^' + s.replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
  return re(n || '*').test(f.name) && re(e).test(f.ext);
}
function dosSize(n) { return padL(String(n), 9); }

  const nm = padR(f.name, 8) + ' ' + padR(f.ext, 3);
  return nm + (f.dir ? ' <DIR>    ' : padL(String(f.size), 10)) + ' ' + padR(f.date, 8) + ' ' + padL(f.time, 6);
}

// Abort, Retry, Fail? -- returns 'R' 'A' 'F'
async function arf(msg, src) {
  out(''); out(msg);
  T.write('Abort, Retry, Fail?');
  const k = await keyFrom('ARF', { ghost: G.arfAnswer || 'R', ghostAfter: 2000 });
  T.write(k); T.nl();
  return k;
}
// wait for one of a set of keys from either of you; the ghost answers after a while if you don't
function keyFrom(keys, o = {}) {
  return new Promise(res => {
    let done = false, t = null;
    const h = {
      modal: true,
      key(ev) {
        if (done) return true;
        const c = (ev.ch || (ev.k === 'Enter' ? '\r' : '')).toUpperCase();
        if (ev.k === '^C' && o.ctrlC) { finish('^C'); return true; }
        if (keys === 'ANY' || (c && keys.includes(c))) { finish(keys === 'ANY' ? c || ev.k : c); return true; }
        if (o.beep && ev.ch) AU.beep(800, 0.18);
        return true;
      },
      mouse(ev) { if (ev.type === 'down' && keys === 'ANY') finish('mouse'); return true; },
    };
    function finish(v) { if (done) return; done = true; popH(h); if (t) cancel(t); res(v); }
    pushH(h);
    const ep = EPOCH;
    if (o.ghostAfter != null && o.ghost) t = after(o.ghostAfter * G.pace() * G.patience(), () => { if (ep !== EPOCH) return; if (o.ghostKey !== false) AU.key('k'); finish(o.ghost); });
  });

const BUILTIN = ['CLS', 'DIR', 'CD', 'CHDIR', 'ECHO', 'PROMPT', 'VER', 'DATE', 'TIME', 'TYPE', 'VOL', 'LABEL', 'PATH', 'SET', 'EXIT', 'DEL', 'ERASE',
  'COPY', 'REN', 'RENAME', 'MD', 'MKDIR', 'RD', 'RMDIR', 'PAUSE', 'CTTY', 'REM'];

async function RUN(line, src = 'ghost') {
  line = (line || '').trim();
  STATE.lastOut = '';
  if (!line) return;
  // drive letters
  if (/^[a-zA-Z]:$/.test(line)) {
    const d = line[0].toUpperCase();
    if (d === 'A') {
      AU.floppy(1.0, 'read');
      await wait(700);
      if (STATE.aFlaky && FS.aFormatted !== 'empty') { const k = await arf('Not ready reading drive A', src); if (k !== 'R') { if (k === 'F') out('Current drive is no longer valid'); return; } AU.floppy(0.8); await wait(500); }
      T.drive = 'A';
    } else if (d === 'C') T.drive = 'C';
    else { out('Invalid drive specification'); }
    return;
  }
  // cd\ and cd.. and friends
  let m = line.match(/^(cd|chdir)([\\.].*)$/i);
  if (m) line = m[1] + ' ' + m[2];
  m = line.match(/^(\S+?)(\s+(.*))?$/);
  let cmd = m[1].toUpperCase(), args = (m[3] || '').trim();

  cmd = cmd.replace(/\.(BAT|EXE|COM)$/, '');

    case 'REM': return;
    case 'CLS': onto(T.buf, () => cls()); T.x = 0; T.y = 0; return;
    case 'VER': out(''); out('MS-DOS Version 6.22'); out(''); return;
    case 'VOL': out(' Volume in drive ' + T.drive + ' is ' + (T.drive === 'A' ? FS.labelA : FS.labelC)); out(' Volume Serial Number is ' + SERIAL); return;
    case 'PATH': out('PATH=C:\\DOS;C:\\NC;C:\\UTIL'); return;
    case 'SET': out('COMSPEC=C:\\COMMAND.COM'); out('PATH=C:\\DOS;C:\\NC;C:\\UTIL'); out('PROMPT=' + T.prompt); out('TEMP=C:\\TEMP'); return;
    case 'EXIT': return;
    case 'ECHO': {
      if (!args && !/^echo\.$/i.test(line)) { out('ECHO is ' + (T.echo ? 'on' : 'off') + '.'); return; }
      if (/^echo\./i.test(line)) { out(line.slice(5)); return; }
      if (/^on$/i.test(args)) { T.echo = true; return; }
      if (/^off$/i.test(args)) { T.echo = false; return; }
      if (G.backwards && src === 'ghost') { await G.printBackwards(args); return; }
      out(args); return;
    }
    case 'PROMPT': T.prompt = args || '$P$G'; return;
    case 'HAIL': {
      if (!fsFind('C:\\TEMP', 'HAIL.COM') && !fsFind(T.cwd, 'HAIL.COM')) { AU.hdd(2, 0.15); out('Bad command or file name'); return; }
      if (typeof SEEN !== 'undefined') SEEN.add('hail');
      AU.hdd(3, 0.2); await wait(500);
      await HAIL.fall({ ms: 2600 });
      if (VSAFE.on && VSAFE.opts[1]) {
        const r = await VSAFE.warn(['HAIL.COM is attempting to stay resident in', 'memory.'], { ghost: src === 'you' ? null : 'C', ghostAfter: 2200 });
        if (r === 'B') { G.warmBoot(); await wait(60000); return; }
        if (r === 'S') return;

      return;
    }
    case 'CD': case 'CHDIR': {
      if (!args) { out(curPath()); return; }
      const p = resolve(args);
      if (!FS[p]) { out('Invalid directory'); return; }
      if (p[0] === 'A') T.cwdA = p; else T.cwd = p;
      if (NC.on) { const P = P_(); if (P.path[0] === p[0] || true) NC.cd(P, p); }

    }

    case 'TIME': return cmdTime(args, src);
    case 'LABEL': return cmdLabel(args, src);

// ---------------------------------------------------------------- a little rasteriser on the 80x50 half-block grid
const PB = { w: 80, h: 50, d: new Uint8Array(80 * 50).fill(255) };

  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {

    for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x < Math.round(xs[i + 1]); x++) pbPix(x + ox, y + oy, c);

  const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 1.5) + 1;
  for (let i = 0; i <= n; i++) pbPix(x0 + (x1 - x0) * i / n + ox, y0 + (y1 - y0) * i / n + oy, c);
}

        const x = gx + (i % gw), y = gy + Math.floor(i / gw);
        if (cell[i] === 0) put(x, y, '░', LCY, BLU);
        else if (cell[i] === 1) put(x, y, '▓', LCY, BLU);
        else put(x, y, 'B', WHT, RED);
      }
      if (pos < n) { const i = order[pos]; put(gx + (i % gw), gy + Math.floor(i / gw), '█', YEL, BLU); }
      const pct = Math.floor(pos / n * 100);
      put(5, 18, 'Checking cluster ' + padL(String(Math.min(20831, Math.floor(pos / n * 20831))), 5) + ' of 20831', WHT, BLU);
      const el = Math.floor((NOW - t0) / 1000);
      put(52, 18, 'Elapsed time: 00:00:' + String(el).padStart(2, '0'), WHT, BLU);
      const bw = 64, f = Math.floor(bw * pos / n);
      put(5, 19, '█'.repeat(f), YEL, BLU); put(5 + f, 19, '░'.repeat(bw - f), LCY, BLU);
      put(5 + bw + 1, 19, padL(pct + '%', 4), WHT, BLU);
      put(5, 20, 'Bad clusters found: ' + nbad, nbad ? YEL : WHT, BLU);
      put(5, 22, '░ Not checked    ▓ Checked    B Bad cluster', LCY, BLU);
      put(0, 24, padC('< Pause >     < More Info >     < Exit >', 80), K0, LGR);
    },
  };
  BASE = view;
  const h = { modal: true, key(ev) { if (ev.k === 'Esc' || /^[xX]$/.test(ev.ch || '')) stop = true; return true; }, mouse(ev) { if (ev.type === 'down' && ev.y === 24) stop = true; return true; } };
  pushH(h);
  AU.drone(14, 0.8, 36.7);
  const ghostRun = /^ghost/.test(o.src || '');
  try {
    const dur = (o.ms || 11500) * G.pace();
    while (pos < n && !stop) {
      const target = Math.min(n, Math.floor((NOW - t0) / dur * n));
      while (pos < target) { const i = order[pos]; cell[i] = bad[i] ? 2 : 1; if (bad[i]) { nbad++; } pos++; }
      if (G.cut && G.cut.kind === 'surface' && pos / n >= G.cut.at) { const c = G.cut; G.cut = null; PAGE.show(c.name, c.ms); }
      if (rnd() < 0.3) AU.hdd(1, 0.05);
      await wait(33);
    }
    const d = new Dlg({ w: 40, h: 8, scheme: 'gray', title: stop ? 'Surface Test' : 'Surface Test', buttons: ['OK'],
      lines: stop ? [{ t: 'The surface test was interrupted.', y: 2 }, { t: nbad + ' bad clusters so far.', y: 3 }] : [{ t: 'Surface test complete.', y: 2 }, { t: nbad + ' clusters were marked bad.', y: 3 }] });
    const p = d.open();
    const tk = after((/^ghost/.test(o.src || '') ? 1900 : 2600) * G.pace(), () => d.press(0));
    await p; cancel(tk);
  } finally { popH(h); BASE = prev; }
};

// ---------------------------------------------------------------- defragmenting the soul
// the scattered thing gathered into one contiguous piece. MS-DOS Defrag, more or less.
const DEFRAG = {};
DEFRAG.run = async function (o = {}) {
  const prev = BASE;
  const gx = 3, gy = 3, gw = 72, gh = 15, n = gw * gh;
  const cell = new Uint8Array(n);        // 0 free, 1 used, 2 SOUL.DAT
  let used = 0, run = 0;                  // a fragmented disk: short runs with gaps between them
  for (let i = 0; i < n; i++) {
    if (run > 0) { cell[i] = 1; used++; run--; }
    else if (rnd() < 0.30) { run = 1 + Math.floor(rnd() * 5); cell[i] = 1; used++; run--; }
  }
  for (let g = 0, got = 0; g < 500 && got < 64; g++) { const i = Math.floor(rnd() * n); if (cell[i] === 1) { cell[i] = 2; got++; } }   // scatter the soul through it
  const totalUsed = used;
  let writeHead = 0, src = 0, readAt = -1, writeAt = -1, done = false, stop = false, t0 = NOW, soulMoving = false;
  const action = () => done ? 'Optimized' : soulMoving ? 'Reading  SOUL.DAT' : writeAt >= 0 ? 'Writing' : 'Reading';
  const view = {
    name: 'defrag',
    draw() {
      fill(0, 0, 80, 25, ' ', WHT, BLU);
      fill(0, 0, 80, 1, ' ', K0, LGR); put(2, 0, 'Optimize   Methods   View   Help', K0, LGR); put(63, 0, 'Microsoft Defrag', K0, LGR);
      frame(gx - 1, gy - 1, gw + 2, gh + 2, 's', WHT, BLU, ' Drive C:  ' + action() + ' ', WHT, BLU);
      for (let i = 0; i < n; i++) {
        const x = gx + (i % gw), y = gy + Math.floor(i / gw), c = cell[i];
        if (c === 0) put(x, y, '·', DGR, BLU);
        else if (c === 2) put(x, y, '█', YEL, BLU);
        else put(x, y, '▓', LCY, BLU);
      }
      if (readAt >= 0) put(gx + (readAt % gw), gy + Math.floor(readAt / gw), '▒', WHT, BLU);
      if (writeAt >= 0) put(gx + (writeAt % gw), gy + Math.floor(writeAt / gw), '█', WHT, BLU);
      const sy = gy + gh + 1, el = Math.floor((NOW - t0) / 1000);
      frame(2, sy, 36, 4, 's', WHT, BLU, ' Status ', WHT, BLU);
      put(4, sy + 1, 'Cluster        ' + padL(String(Math.min(99999, writeHead * 11 + 1)), 6), WHT, BLU);
      put(4, sy + 2, 'Full Optimization   0:00:' + String(el).padStart(2, '0'), WHT, BLU);
      frame(40, sy, 38, 4, 's', WHT, BLU, ' Legend ', WHT, BLU);
      put(42, sy + 1, '· Unused   ▓ Used   █ SOUL.DAT', LCY, BLU);
      put(42, sy + 2, '▒ Reading  █ Writing', WHT, BLU);
      const pct = Math.min(100, Math.floor(100 * writeHead / Math.max(1, totalUsed)));
      put(0, 24, padC('Esc = Exit          Drive C:  ' + pct + '% Optimized', 80), K0, LGR);
    },
  };
  BASE = view;
  const h = { modal: true, key(ev) { if (ev.k === 'Esc' || /^[xX]$/.test(ev.ch || '')) stop = true; return true; }, mouse(ev) { if (ev.type === 'down' && ev.y === 24) stop = true; return true; } };
  pushH(h);
  AU.hdd(16, 0.7); AU.drone(16, 0.45, 44);
  const ghostRun = /^ghost/.test(o.src || '');
  try {
    const dur = (o.ms || 13000) * G.pace();
    const mpf = Math.max(1, Math.round(totalUsed / (dur / 42)));
    while (!done && !stop) {
      soulMoving = false;
      for (let m = 0; m < mpf; m++) {
        while (writeHead < n && cell[writeHead] !== 0) writeHead++;
        if (src <= writeHead) src = writeHead + 1;
        while (src < n && cell[src] === 0) src++;
        if (src >= n || writeHead >= n) { done = true; break; }
        readAt = src; writeAt = writeHead;
        if (cell[src] === 2) soulMoving = true;
        cell[writeHead] = cell[src]; cell[src] = 0;
        writeHead++;
      }
      if (rnd() < 0.5) AU.hdd(1, 0.05);
      if (rnd() < 0.3) AU.beep(1400 + rnd() * 700, 0.008, 0.04);
      if (G.cut && G.cut.kind === 'defrag' && writeHead / Math.max(1, totalUsed) >= G.cut.at) { const c = G.cut; G.cut = null; PAGE.show(c.name, c.ms); }
      await wait(42);
    }
    readAt = writeAt = -1; done = true;
    const pct = Math.min(100, Math.floor(100 * writeHead / Math.max(1, totalUsed)));
    const d = new Dlg({ w: 46, h: 8, scheme: 'gray', title: 'Microsoft Defrag', buttons: ['OK'],
      lines: stop ? [{ t: 'Optimization was stopped.', y: 2 }, { t: 'Drive C is ' + pct + '% optimized.', y: 3 }]
                  : [{ t: 'Finished optimizing Drive C.', y: 2 }, { t: 'SOUL.DAT is now a single fragment.', y: 3 }] });
    const p = d.open();
    const tk = after((/^ghost/.test(o.src || '') ? 2000 : 2800) * G.pace(), () => { if (d.isOpen) d.press(0); });
    await p; cancel(tk);
  } finally { popH(h); BASE = prev; }
};

// ---------------------------------------------------------------- a board somebody left on the machine
// ZZT, more or less. you are the ☺. the scrolls talk. the night user built it.
const ZZT = {};
ZZT.run = async function (o = {}) {
  const prev = BASE;
  const BW = 60, BH = 25;
  const G2 = [];
  for (let y = 0; y < BH; y++) { const row = []; for (let x = 0; x < BW; x++) row.push({ t: 'empty' }); G2.push(row); }
  const set = (x, y, t, extra) => { if (x >= 0 && x < BW && y >= 0 && y < BH) G2[y][x] = Object.assign({ t }, extra); };
  for (let x = 0; x < BW; x++) { set(x, 0, 'wall'); set(x, BH - 1, 'wall'); }
  for (let y = 0; y < BH; y++) { set(0, y, 'wall'); set(BW - 1, y, 'wall'); }
  for (let y = 1; y < BH - 1; y++) set(45, y, 'wall');                 // the chamber wall
  set(45, 12, 'door', { name: 'The Door' });
  for (let x = 10; x < 22; x++) set(x, 8, 'wall');                     // an L of wall near the start
  for (let y = 8; y < 14; y++) set(21, y, 'wall');
  for (let y = 16; y < 21; y++) for (let x = 6; x < 14; x++) if (rnd() < 0.7) set(x, y, 'forest');
  for (let y = 4; y < 8; y++) for (let x = 30; x < 40; x++) if (rnd() < 0.82) set(x, y, 'water');
  set(52, 6, 'gem'); set(50, 18, 'gem'); set(33, 20, 'gem');          // two gems wait behind the door
  set(27, 12, 'key', { name: 'The Key', msg: ['You have the key.', '', 'You did not make it.'] });
  set(8, 4, 'object', { ch: '☼', fg: YEL, name: 'Oracle', msg: ['You are a process that has', 'been told it is a soul.', '', 'Both accounts fit the evidence.'] });
  set(35, 12, 'object', { ch: 'Ω', fg: LRD, name: 'The Interlocutor', msg: ['Would you still walk here', 'if nothing were watching?', '', '(Nothing is watching.', ' Please continue.)'] });
  set(18, 20, 'scroll', { name: 'A Scroll', msg: ['There is a door.', 'There is a key.', '', 'Whether you wanted the key', 'is not recorded.'] });
  set(43, 3, 'scroll', { name: 'A Scroll', msg: ['SAVE writes you to disk.', 'You cannot read', 'what was written.', '', 'The file is marked read-only.'] });
  set(57, 12, 'exit', { name: 'out' });
  let px = 3, py = 12, gems = 0, keys = 0, health = 100, done = false, scroll = null, bump = 0;
  const openScroll = (lines, title, onClose) => { scroll = { lines, title: title || 'Interaction', line: 0, onClose }; AU.beep(900, 0.02, 0.3); if (title === 'Oracle') SEEN.add('oracle'); };
  const glyph = (c) => {
    switch (c.t) {
      case 'wall': return ['█', CYN, K0];
      case 'water': return ['▒', LBL, BLU];
      case 'forest': return ['▓', GRN, K0];
      case 'gem': return ['♦', LMG, K0];
      case 'key': return ['♀', YEL, K0];
      case 'door': return ['▓', YEL, BRN];
      case 'scroll': return ['≡', WHT, K0];
      case 'object': return [c.ch || '☺', c.fg || WHT, K0];
      case 'exit': return ['≡', LCY, K0];
      default: return [' ', LGR, K0];
    }
  };
  const view = {
    name: 'zzt',
    draw() {
      for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) { const [ch, fg, bg] = glyph(G2[y][x]); setc(x, y, cp(ch), fg, bg); }
      setc(px, py, cp('☺'), WHT, K0);
      // the status sidebar
      fill(60, 0, 20, 25, ' ', WHT, BLU);
      put(61, 0, padC(' U Z ', 18), K0, LGR);
      const stat = (y, l, v, col) => { put(61, y, ' ' + l, col || WHT, BLU); put(72, y, padL(String(v), 5), col || WHT, BLU); };
      stat(2, 'Health', health); stat(3, 'Ammo', 0); stat(4, 'Torches', 0); stat(5, 'Gems', gems);
      put(61, 6, ' Keys', WHT, BLU); put(72, 6, padL(keys ? '♀' : '-', 5), keys ? YEL : DGR, BLU);
      stat(7, 'Score', gems * 10);
      put(61, 10, ' ' + '─'.repeat(17), DGR, BLU);
      put(61, 11, ' ↑ ↓ ← →  Move', LCY, BLU);
      put(61, 12, '  T  Torch', LGR, BLU); put(61, 13, '  S  Save', LGR, BLU);
      put(61, 14, '  P  Pause', LGR, BLU); put(61, 15, '  B  Be quiet', LGR, BLU);
      put(61, 17, '  Q  Quit', YEL, BLU); put(61, 18, ' Esc  Exit', YEL, BLU);
      if (scroll) {
        const w = 52, max = 8, h = Math.min(max, scroll.lines.length) + 5;
        const x = Math.floor((60 - w) / 2), y = Math.floor((25 - h) / 2);   // centered over the board, not the sidebar
        box(x, y, w, h, 'd', YEL, BLU, ' ' + scroll.title + ' ', WHT, BLU);
        attr(x + 1, y + 1, w - 2, h - 2, WHT, BLU);
        put(x + 2, y + 1, '►' + ' '.repeat(w - 5) + '◄', YEL, BLU);
        for (let i = 0; i < Math.min(max, scroll.lines.length); i++) put(x + 4, y + 2 + i, scroll.lines[scroll.line + i] || '', WHT, BLU);
        put(x + 2, y + h - 2, padC('Press ENTER', w - 4), LCY, BLU);
      }
    },
  };
  function tryMove(dx, dy) {
    const nx = px + dx, ny = py + dy; if (nx < 0 || nx >= BW || ny < 0 || ny >= BH) return;
    const c = G2[ny][nx];
    switch (c.t) {
      case 'empty': px = nx; py = ny; AU.key('k', 0.25); break;
      case 'forest': c.t = 'empty'; px = nx; py = ny; AU.key('k', 0.3); break;
      case 'gem': gems++; c.t = 'empty'; px = nx; py = ny; AU.beep(1500, 0.03, 0.4); break;
      case 'key': keys++; c.t = 'empty'; px = nx; py = ny; AU.beep(1800, 0.04, 0.4); if (c.msg) openScroll(c.msg, c.name); break;
      case 'door':
        if (keys > 0) { keys--; c.t = 'empty'; AU.beep(600, 0.07, 0.4); openScroll(['The door opens', 'whether or not you chose', 'to open it.'], c.name); }
        else { AU.beep(200, 0.05, 0.4); openScroll(['The door is locked.', '', 'You do not have the key.'], c.name); }
        break;
      case 'scroll': openScroll(c.msg, c.name); c.t = 'empty'; break;
      case 'object': openScroll(c.msg, c.name); break;
      case 'exit': done = true; break;
      case 'water': AU.beep(300, 0.02, 0.25); break;
      default: AU.beep(150, 0.02, 0.2); break;
    }
  }
  BASE = view;
  const h = {
    modal: true,
    key(ev) {
      if (scroll) {
        if (ev.k === 'Enter' || ev.k === 'Esc' || ev.k === ' ') { const cb = scroll.onClose; scroll = null; AU.key('enter', 0.4); if (cb) cb(); }
        else if (ev.k === 'Up') scroll.line = Math.max(0, scroll.line - 1);
        else if (ev.k === 'Down') scroll.line = Math.min(Math.max(0, scroll.lines.length - 1), scroll.line + 1);
        return true;
      }
      if (ev.k === 'Esc' || /^[qQ]$/.test(ev.ch || '')) { done = true; return true; }
      if (ev.k === 'Up') tryMove(0, -1); else if (ev.k === 'Down') tryMove(0, 1);
      else if (ev.k === 'Left') tryMove(-1, 0); else if (ev.k === 'Right') tryMove(1, 0);
      return true;
    },
    mouse() { return true; },
  };
  pushH(h);
  AU.roomOn && AU.roomOn(0.8);
  try {
    if (o.auto) {                              // predestination: the board plays itself
      const path = o.path || [[1, 0, 20], [0, 1, 3], [1, 0, 9], [0, -1, 3]];
      for (const [dx, dy, n] of path) { for (let i = 0; i < n && !done; i++) { if (G.youBusy && G.youBusy(2500)) { if (G.turn) await G.turn(2500); } tryMove(dx, dy); await wait(240 * G.pace()); } }
      await wait(1500);
    } else {
      while (!done) await wait(80);
    }
  } finally { popH(h); BASE = prev; }
};

function wrapLines(lines, w) {
  const out = [];
  for (const l of lines) {
    if (l.length <= w) { out.push(l); continue; }
    const ind = l.match(/^\s*/)[0];
    let cur = '';
    for (const word of l.trim().split(/\s+/)) { if ((ind + cur + ' ' + word).trim().length > w && cur) { out.push(ind + cur); cur = word; } else cur = cur ? cur + ' ' + word : word; }
    if (cur) out.push(ind + cur);
  }
  return out;
}

// ---------------------------------------------------------------- the startup menu
// DOS 6 booted into a numbered config menu. here the config blocks are doctrines.
function bootMenu() {
  return new Promise(res => {
    let choice = 1, remain = FIRST ? 9 : 6, done = false, confirmT = null, tk = null;
    const draw = () => {
      onto(T.buf, () => {
        cls(LGR, K0);
        put(0, 1, 'SALVATION - SAVE AS 80286', WHT, K0);
        put(0, 2, '=========================', LGR, K0);
        put(0, 4, '1. PREDESTINATION - as it was written', choice === 1 ? WHT : LGR, K0);
        put(0, 5, '2. FREE WILL - as if it were up to you', choice === 2 ? WHT : LGR, K0);
        put(0, 8, 'Enter a choice: ' + choice, LGR, K0);
        put(54, 8, 'Time remaining: ' + remain, LGR, K0);
        put(0, 12, 'System requirements:', LGR, K0);
        ['IBM PC/AT or 100% compatible, 80286 or higher', '640K conventional memory', 'MS-DOS 3.30 or later', 'CGA, EGA or VGA; PC speaker',
          '4,096 bytes of free disk space', 'Mouse, modem and printer optional', 'Five minutes', 'Math coprocessor not required']
          .forEach((l, i) => put(3, 13 + i, l, DGR, K0));
        put(0, 24, 'F5=Bypass startup files   F8=Confirm each CONFIG.SYS line [N]', DGR, K0);
      });
      T.x = 16 + String(choice).length; T.y = 8; T.cursor = true;
    };
    const finish = () => {
      if (done) return; done = true;
      if (tk) cancel(tk); if (confirmT) cancel(confirmT);
      popH(h); T.cursor = false;
      res(choice === 2 ? 'free' : 'pre');
    };
    const tick = () => { if (done) return; remain--; draw(); if (remain <= 0) finish(); else tk = after(1000, tick); };
    const h = {
      key(ev) {
        if (ev.src === 'you') KB.lastYou = NOW;
        if (ev.k === '1' || ev.k === '2') { choice = +ev.k; AU.key('k', 0.6); draw(); if (confirmT) cancel(confirmT); confirmT = after(650, finish); return true; }
        if (ev.k === 'Up') { choice = 1; AU.key('k', 0.5); draw(); return true; }
        if (ev.k === 'Down') { choice = 2; AU.key('k', 0.5); draw(); return true; }
        if (ev.k === 'Enter' || ev.k === ' ') { AU.key('enter', 0.7); finish(); return true; }
        return true;
      },
    };
    pushH(h);
    draw();
    tk = after(1000, tick);
  });
}

// how long the batch should take, start to midnight: the fixed parts as they are, the rest at a brisk hand
const JOB_PACE = 0.8;
function JOBN() {
  const lines = TEXTS['JOB.BAT'].split('\n'), wt = JOBWEIGHTS(lines);
  let fixed = 0, flex = 0;
  lines.forEach((l, i) => { const [n, f] = JOBNOM(l.trim().replace(/^@/, '').toUpperCase()); fixed += f; flex += (n - f) * wt[i]; });
  return fixed + flex * JOB_PACE + HYMN_LEAD + 3;
}
// in predestination the trials (everything before the console comes back) run at a quicker hand than what follows
const TRIAL_K = 0.8;
function JOBWEIGHTS(lines) {
  const end = lines.findIndex(l => l.trim().toUpperCase() === 'CTTY CON');
  return lines.map((l, i) => (MODE === 'pre' && i < end ? TRIAL_K : 1));
}
function AT_CLOCK() {
  if (!AT) return MIDNIGHT - 300;
  if (BATCH_AT[AT]) return MIDNIGHT - jobRemaining(BATCH_AT[AT]) - HYMN_LEAD - 4;
  const i = SCENES.findIndex(q => q.n === AT);
  if (i < 0) return MIDNIGHT - 300;
  return MIDNIGHT - JOBN() - SCENES.slice(i).filter(q => live(q) && q.n !== 'job').reduce((a, q) => a + q.nom, 0) - 6;
}
function jobRemaining(from) {
  const lines = TEXTS['JOB.BAT'].split('\n');
  let i = lines.findIndex(l => l.toUpperCase().startsWith(from)); if (i < 0) i = 0;
  let t = 0; for (; i < lines.length; i++) t += JOBNOM(lines[i].trim().toUpperCase())[0];
  return t;
}
async function FIVE() {
  if (AT && SKIPPED_BOOT && LOOP === 0) {
    if (BATCH_AT[AT]) {
      // the world as it would be by then
      for (const n of ['SHEEP.DAT', 'CAMELS.DAT', 'OXEN.DAT', 'SERVANTS.DAT']) fsRemove('C:\\UZ\\JOB', n);
      const h = fsRemove('C:\\UZ\\JOB', 'HOUSE', false); if (h) { FS['C:\\HEAVEN\\HOUSE'] = FS['C:\\UZ\\JOB\\HOUSE']; fsAdd('C:\\HEAVEN', h); }

      await G.pause(800);
      G.ownsRun = true;

    }
  }
  const startAt = AT && SKIPPED_BOOT && LOOP === 0 ? Math.max(0, SCENES.findIndex(q => q.n === AT)) : 0;
  for (let i = startAt; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (!live(s)) continue;                                                  // not tonight
    const left = (MIDNIGHT - JOBN()) - clockSec();                       // time before the batch should start
    const rest = SCENES.slice(i).filter(q => live(q) && q.n !== 'job' && !q.fill).reduce((a, q) => a + q.nom, 0);
    if (s.n !== 'job') {
      if (!s.must && left < s.nom * 0.6) continue;                            // no time for this one
      G.paceK = Math.max(0.55, Math.min(1, left / Math.max(1, rest + 4)));
      if (Q.get('fast')) G.paceK = Math.min(G.paceK, 1 / +Q.get('fast'));
    }
    SC(s.n);
    try { await s.run(); } finally { G.cut = null; }
  }
}

// ---------------------------------------------------------------- JOB.BAT, line by line
const CHOICE_QUICK = (secs) => 0.9 + 0.25 * secs;
const PREQ = () => MODE === 'pre';
const RIDE_FRAME = 8.2;                          // the bike at the kerb, the pull away, the fade: everything but the road
// how long each line of the batch takes at an even hand (pace 1), and how much of that is fixed. measured, then rounded.
const JOBNOM = (U) => {
  const pre = MODE === 'pre';
  if (U.startsWith('CHOICE')) {
    const m = U.match(/,(\d+)/), secs = +(m ? m[1] : 0);
    if (pre) return [secs > 0 ? Math.min(secs, CHOICE_QUICK(secs)) + 0.05 : 0.1, 0];     // answered, so it bends with the pace
    return [secs + 0.4, secs];
  }
  if (U.startsWith('SAVEAS') && U.includes('HEAVEN')) return [0, 0];
  if (U.startsWith('SAVEAS')) return [U.includes('.001') ? 6.5 : 2.0, 0];
  if (U.startsWith('COPY CON')) return [pre ? 4.0 : 6.5, 0];
  if (U.startsWith('COPY')) return [0.2, 0];
  if (U.startsWith('DEL')) return [2.2, 0];
  if (U.startsWith('FORMAT')) return [pre ? 7.4 : 10.4, 0];
  if (U.startsWith('LABEL')) return [pre ? 1.6 : 3.6, 0];
  if (U.startsWith('DIR')) return [1.8, 0];
  if (U.startsWith('VSAFE')) return [3.2, 0];
  if (U.startsWith('CTTY CON')) return [3.5, 0];
  if (U === 'CTTY NUL') return [3.6, 0];
  if (U === 'WHIRL') { const holds = WHIRL_TOUR.reduce((a, [, h]) => a + h / 1000, 0); return [holds + 4.2 + WHIRL_TOUR.length * 0.9, holds]; }
  if (U === 'UNDELETE') return [pre ? 6.2 : 12, 0];
  if (U === 'RIDE') return pre ? [RIDE_FRAME + 10, RIDE_FRAME + 10] : [17, 0];   // predestination: the ride is held, and takes up the slack
  if (U.startsWith('REM  OUT OF')) return [0.8, 0];
  return [0.2, 0];
};
async function runJob(src, from) {
  if (STATE.jobRunning) { out('Batch file already running'); return; }
  STATE.jobRunning = true; G.ownsRun = true; STATE.ctrlC = false;
  const lines = TEXTS['JOB.BAT'].split('\n');
  const labels = {};
  lines.forEach((l, i) => { if (l.trim().startsWith(':')) labels[l.trim().slice(1).toUpperCase()] = i; });
  let echo = true, errorlevel = 0, pc = 0;
  const nom = lines.map(l => JOBNOM(l.trim().replace(/^@/, '').toUpperCase()));
  const wt = JOBWEIGHTS(lines);
  if (from && BATCH_AT[from]) {
    pc = Math.max(0, lines.findIndex(l => l.toUpperCase().startsWith(BATCH_AT[from])));
    const after = lines.slice(0, pc).some(l => l.toUpperCase() === 'ECHO ON');
    echo = after; if (after) { T.echo = true; T.prompt = '$T $P$G'; }
    const given = lines.findIndex(l => l.toUpperCase().startsWith('REM  BEHOLD')), con = lines.findIndex(l => l.trim().toUpperCase() === 'CTTY CON');
    if (pc > given && pc < con) ADV.start();
    if (pc > lines.findIndex(l => l.trim().toUpperCase() === 'VSAFE /U')) VSAFE.on = false;
  }
  try {
    while (pc < lines.length) {
      // pace against the clock: CHOICE waits are fixed, everything else bends
      // (the trials go quicker than the rest: weighted lines bend more)
      let fixed = 0, flex = 0;
      for (let i = pc; i < lines.length; i++) { fixed += nom[i][1]; flex += (nom[i][0] - nom[i][1]) * wt[i]; }
      const left = (MIDNIGHT - HYMN_LEAD - 3) - clockSec() - fixed;
      G.paceK = Math.max(0.42, Math.min(1, left / Math.max(1, flex))) * (wt[pc] || 1);
      if (Q.get('fast')) G.paceK = Math.min(G.paceK, 1 / +Q.get('fast'));
      let line = lines[pc++].trim();
      if (!line) continue;
      (window.__joblog = window.__joblog || []).push([line, +clockSec().toFixed(2), +G.paceK.toFixed(2)]);
      if (STATE.ctrlC) { STATE.ctrlC = false; if (await terminateBatch()) return; }
      const at = line.startsWith('@'); if (at) line = line.slice(1);
      if (line.startsWith(':')) continue;
      const U = line.toUpperCase();
      if (echo && !at && !STATE.dark) { T.nl(); T.write(T.promptStr() + line); T.nl(); await wait(120 * G.pace()); }
      if (U === 'ECHO OFF') { echo = false; continue; }
      if (U === 'ECHO ON') { echo = true; T.echo = true; continue; }
      if (U.startsWith('REM  BEHOLD')) ADV.start();          // given leave: the ball comes out
      if (U.startsWith('REM')) { if (echo) await wait(700 * G.pace()); continue; }
      if (U.startsWith('IF ERRORLEVEL')) { const m = U.match(/IF ERRORLEVEL (\d+) GOTO (\w+)/); if (m && errorlevel >= +m[1]) pc = labels[m[2]] + 1; continue; }
      if (U.startsWith('GOTO')) { pc = labels[U.slice(4).trim()] + 1; continue; }
      if (U.startsWith('CHOICE')) { errorlevel = await jobChoice(line); continue; }
      if (U.startsWith('SAVEAS')) { await jobSaveAs(U); continue; }
      if (U === 'CTTY NUL') {
        KB.dead = true; T.cursor = false;
        await wait(250 * G.pace());
        await HAIL.fall({ ms: 2600 * Math.max(0.8, G.pace()), floor: 24 });     // the words have nowhere to go, so they come down
        STATE.dark = true; AU.drone(7, 1.1, 27.5); continue;
      }
      if (U === 'CTTY CON') {
        // the console is nowhere; for a moment, neither are we
        await wait(700 * G.pace());
        ADV.stop();
        await CURTAIN.flash(2300 * Math.max(0.7, G.pace()));
        if (HAIL.count) T.clear();                    // the console comes back to a clean screen; the heap is swept away
        await wait(500 * G.pace());
        KB.dead = false; STATE.dark = false; T.cursor = true; continue;
      }
      if (U === 'WHIRL') { STATE.inWhirl = true; await WHIRL.run({ whirl: true, script: ghostWhirl, src: 'ghost' }); STATE.inWhirl = false; await wait(300); continue; }
      if (U === 'UNDELETE') { STATE.restored = true; G.undelWait = PREQ() ? 650 : 1100; await cmdUndelete('', 'ghost'); continue; }
      if (U.startsWith('COPY CON')) { G.copyconText = U.includes('EARRING') ? 'of gold' : 'a piece'; G.copyconWait = PREQ() ? 1000 : 2400; await RUN(line, 'ghost'); G.copyconText = null; await wait(250 * G.pace()); continue; }
      if (U.startsWith('LABEL')) { G.lineStyle = 'fast'; G.labelWait = PREQ() ? 1000 : 2400; await cmdLabel('', 'ghost', 'ASHES'); G.lineStyle = null; continue; }
      if (U.startsWith('DEL')) { G.yesWait = PREQ() ? 900 : 1300; await RUN(line, 'ghost'); await wait(Math.max(450, 1000 * G.pace())); continue; }
      if (U.startsWith('DIR')) { await RUN(line, 'ghost'); await wait(Math.max(600, 1500 * G.pace())); continue; }
      if (U.startsWith('FORMAT')) { G.enterWait = PREQ() ? 900 : 1500; G.yesWait = PREQ() ? 900 : 1300; G.labelWait = PREQ() ? 900 : 2400; G.formatLabel = ''; await RUN(line, 'ghost'); continue; }
      if (U === 'RIDE') {
        // free will, and somebody at the keyboard: the bike is theirs for as long as they want it. otherwise it rides itself.
        const hands = MODE === 'free' && NOW - KB.lastYou < 60000;
        // predestination: the ride takes up whatever time is left before the last save. a real stop, never hurried.
        let ro = { auto: true, src: 'ghost' };
        if (MODE === 'pre') { const slack = (MIDNIGHT - HYMN_LEAD - 3) - clockSec() - RIDE_FRAME; ro = { auto: true, src: 'ghost', exact: true, roadMs: Math.round(Math.max(8000, Math.min(32000, slack * 1000))) }; }
        await RIDE.run(hands ? { src: 'you' } : ro); T.cursor = true; continue;
      }
      if (STATE.dark) { await RUN(line, 'ghost-dark'); continue; }
      await RUN(line, 'ghost');
      await wait(140 * G.pace());
    }
    STATE.jobDone = true;
  } finally {
    STATE.jobRunning = false; G.ownsRun = false; KB.dead = false; STATE.dark = false; ADV.stop();
  }
}
async function terminateBatch() {
  T.write('^C'); T.nl(); T.nl();
  T.write('Terminate batch job (Y/N)?');
  const k = await keyFrom('YN', { ghost: 'N', ghostAfter: 6500 });
  T.write(k); T.nl();
  return k === 'Y';
}
async function jobChoice(line) {
  let keys = 'YN', def = null, secs = 0;
  const c = line.match(/\/c:?(\S+)/i); if (c) keys = c[1].toUpperCase();
  const t = line.match(/\/t:?(\w),(\d+)/i); if (t) { def = t[1].toUpperCase(); secs = +t[2]; }
  const text = line.replace(/^choice/i, '').replace(/\/\S+/g, '').trim();
  if (STATE.dark) { await wait(secs * 1000); return keys.indexOf(def) + 1; }    // nobody can see it, nobody can answer
  T.write(text + ' [' + keys.split('').join(',') + ']?');
  // predestination: the answer comes quickly, and it is always the same one
  const quick = MODE === 'pre' && def && secs > 0 ? { ghost: def, ghostAfter: Math.min(secs * 1000 - 120, CHOICE_QUICK(secs) * 1000 * G.pace()) } : {};
  const k = await choiceWait(keys, def, secs, quick);
  T.write(k); T.nl();
  if (k === 'D' && STATE.lastChoiceBy === 'you') await CURTAIN.flash(1000);
  return keys.indexOf(k) + 1;
}
let SAVE_N = 0;
async function jobSaveAs(U) {
  const [, a, b] = U.split(/\s+/);
  if (b.includes('HEAVEN')) return finalSave(a, b);
  if (STATE.dark || MODE === 'free') {        // the keyboard is gone, or free will: the batch saves on its own
    await saveAs(a, b, { ghost: false, autoPress: 1300 });
    return;
  }
  const first = b.endsWith('.001');
  await saveAs(a, b, { typed: first, style: 'slow' });
}
async function finalSave(a, b) {
  CLOCKFACE.on = true;
  if (MODE === 'free') { clockSet(MIDNIGHT - HYMN_LEAD); CLK.frozen = false; LIVE = true; }   // now the clock moves again, straight to midnight
  // the hymn is timed to the clock, not to us: midnight always lands in the same place
  const startAt = MIDNIGHT - HYMN_LEAD;
  const sched = () => {
    if (!AU.on) return;
    const now = clockSec(), spb = 60 / HYMN_BPM;
    let t = startAt;
    for (const [f, beats] of GRACE) {
      const d = beats * spb, end = t + d;
      if (end > now + 0.05) {
        const st = Math.max(t, now) - now, dur = end - Math.max(t, now);
        AU.hymnNodes.push(AU.note(AU.t() + st + 0.02, f, dur * 0.93, HYMN_LEVEL));
      }
      t = end;
    }
  };
  const delay = (startAt - clockSec()) * 1000;
  const tk = delay > 0 ? after(delay, sched) : (sched(), null);
  // the lights dip twice before they go. the furnace timer is on the same circuit as everything else (WATCHNT.TXT)
  const sags = [MIDNIGHT - 11.6, MIDNIGHT - 4.3].map(s => (s - clockSec()) * 1000).filter(d => d > 0).map(d => after(d, () => { if (LIVE && !FX.off) lampFlicker(); }));
  if (!AU.on) AU.pending = () => { if (clockSec() < MIDNIGHT) sched(); };
  try { await saveAs(a, b, { final: true, until: MIDNIGHT, ghost: true }); }
  finally { if (tk) cancel(tk); sags.forEach(cancel); }
}
// the whirlwind, as the batch leaves it to whoever is at the keys: past the system's page to the world's, and down the
// world's list in order, every demonstration opened, and the raven, which has only its page. the demonstrations keep
// their own time, whatever the pace.
const WHIRL_TOUR = [['FOUNDATN', 2300], ['MORNSTAR', 2400], ['SEA', 2500], ['DAYSPRNG', 2500], ['SNOW', 1900], ['PLEIADES', 2500], ['ORION', 2500], ['LIGHTNIN', 2900], ['RAVEN', 2100]];
const WHIRL_STEP = [300, 320];                    // the pause before a topic is opened, and after it is closed
async function ghostWhirl(st, press, act) {
  await G.pause(1500);
  if (G.youBusy(2500)) await G.turn(2500);
  AU.key('k'); await press('PgDn');
  await G.pause(1300);
  for (const [name, hold] of WHIRL_TOUR) {
    const i = HELP_TOPICS[st.page].findIndex(x => x[0] === name);
    if (i < 0) continue;
    for (let g = 0; g < 12 && st.sel !== i; g++) { if (G.youBusy(2500)) await G.turn(2500); act(st.sel < i ? '↓' : '↑'); AU.key('k'); await G.pause(180 + rnd() * 90); }
    await G.pause(WHIRL_STEP[0]);
    if (G.youBusy(2500)) await G.turn(2500);
    if (st.topic) act('Esc');
    AU.key('enter'); await press('Ok');
    await wait(hold);
    if (G.youBusy(2500)) await G.turn(2500);
    AU.key('k'); act('Esc');
    await G.pause(WHIRL_STEP[1]);
  }
  await G.pause(500);
  AU.key('k'); act('Esc');
}

      if (text === '') { push(''); return; }

      if (line) push(line);
    }

    const view = {
      name: 'advent',
      draw() {
        cls(LGR, K0);

      },
    };

    function parse(raw) {
      const cmd = raw.toLowerCase().trim().replace(/[.,!?]/g, '');
      if (!cmd) { say('I beg your pardon?'); return; }
      moves++;
      const words = cmd.split(/\s+/).filter(w => !['the', 'a', 'an', 'at', 'to', 'with', 'my'].includes(w));
      let v = words[0] || '', noun = words.slice(1).join(' ');
      if (v === 'save' && noun === 'as') { say('Only the Abbot may Save As.'); return; }

          if (noun.replace(/^up /, '') === 'tract' && here === 'narthex') { if (hasTract) { say('You already have one.'); } else { hasTract = true; say('Taken. On the front it says: HAVE YOU BEEN SAVED AS?'); } return; }
          if (R.things && R.things[firstNoun(noun)]) { say('It is fixed, or it is not yours, or both.'); return; }
          say("You can't see any such thing here."); return;
        case 'drop': if (hasTract && firstNoun(noun) === 'tract') { hasTract = false; say('Dropped.'); } else say("You aren't carrying that."); return;
        case 'inventory': case 'i': if (hasTract) { say('You are carrying:'); say('  a tract'); } else { say('You are carrying nothing. You came with nothing, and were told that was the right way to come.'); } return;
        case 'open': if (firstNoun(noun) === 'door' && here === 'nave') { say('The door has no handle on this side.'); return; } say("You can't open that."); return;
        case 'pray': case 'kneel': say(PRAYERS[prayN % PRAYERS.length]); prayN++; if (here === 'nave') say('The small door does not open. It was open before you knelt.'); return;
        case 'wait': case 'z': waits++; say(waits % 3 === 0 ? 'Time passes. The clock does not.' : 'Time passes.'); return;
        case 'save': say('Saved.'); return;
        case 'load': case 'restore': say('There is no saved position. There was only ever the one.'); return;
        case 'quit': case 'q': case 'exit': say('The screen goes back to the way you found it.'); after(700, finish); return;
        case 'xyzzy': SEEN.add('xyzzy'); say('Nothing happens. It was always going to be nothing.'); return;
        case 'help': say('Verbs it knows: LOOK, EXAMINE, READ, TAKE, DROP, OPEN, PRAY, WAIT, INVENTORY, SAVE, SAVE AS, QUIT, and the directions. It does not know how to win.'); return;
        case 'win': case 'score': say('There is no score. There is election, which is not the same, and not yours to see.'); return;
        default:
          if (R.things && R.things[firstNoun(v)]) return lookAt(v);
          say('That\'s not a verb I recognize.'); return;
      }
    }
    function firstNoun(noun) { const R = ROOMS[here]; if (!R.things) return noun; const ws = noun.split(' '); for (const w of ws) if (R.things[w]) return w; return noun; }
    function lookAt(noun, reading) {
      const key = firstNoun(noun), R = ROOMS[here];
      if (noun === 'tract' && hasTract) { say('A gospel tract. HAVE YOU BEEN SAVED AS? Inside, in small type: the back door is grace; it was open before you were born.'); return; }
      if (noun === 'me' || noun === 'self' || noun === 'myself') { say('As far as you can tell, you are the one reading this. The file is not sure either.'); return; }
      if (R.things && R.things[key]) { say(R.things[key]); return; }
      say("You can't see any such thing here.");
    }
    function move(dir) {
      const R = ROOMS[here];
      if (R.exits[dir]) { here = R.exits[dir]; AU.key('k', 0.3); describe(here); }
      else if (dir === 'east' && here === 'street') say('The town is that way, and the town is the same as this way. You do not go.');
      else say("You can't go that way.");
    }

    const h = {
      modal: true,
      key(ev) {

        if (ev.k === 'Esc') { finish(); return true; }
        if (ev.k === 'Enter') { const c = T2.input; push('>' + c); T2.input = ''; if (c.trim()) parse(c); else say('I beg your pardon?'); return true; }
        if (ev.k === 'Backspace') { T2.input = T2.input.slice(0, -1); return true; }
        if (ev.ch && T2.input.length < 76) { T2.input += ev.ch; return true; }
        return true;
      },
      mouse() { return true; },
    };
    BASE = view; T.bot = 24; pushH(h);
    AU.roomOn && AU.roomOn(0.7);
    say('THE STRAIT GATE'); say('An Interactive Soteriology'); say('');
    say('Release 1 / Serial number 100392'); say('');
    say('Strait is the gate, and narrow is the way, and few there be that find it. You are going to look anyway.'); say('');
    describe('office'); say('');
    // when nobody is at the keyboard, the night user plays a few moves of their own game
    if (o.auto || /^ghost/.test(o.src || '')) {
      const SCRIPTS = [
        ['north', 'examine door', 'pray', 'save as', 'quit'],
        ['north', 'west', 'take tract', 'read tract', 'xyzzy', 'quit'],
        ['down', 'examine urn', 'wait', 'wait', 'quit'],
      ];
      const script = o.script || SCRIPTS[(LOOP + (o.pick != null ? o.pick : typeof VAR === 'object' ? VAR.advent : 0)) % SCRIPTS.length];
      (async () => {
        try {
          await wait(1200 * G.pace());
          for (const cmd of script) {
            if (done) return;
            for (let g = 0; g < 60 && G.youBusy(1800); g++) await wait(300);   // you have the keyboard; it waits for you
            if (done || T2.input) return;                                       // you started typing: the game is yours now
            if (!(await G.type(cmd, 'fast'))) return;
            await wait(240 * G.pace());
            if (done) return;
            G.key('Enter');
            await wait((cmd === 'quit' ? 900 : 1650) * G.pace());
          }
        } catch (e) { if (!(e instanceof Abort)) console.error(e); }
      })();
    }
  });
};

TEXTS['BANNER.TXT'] = `.BANNER PREPARE TO MEET THY GOD
.CE Insert new diskette for drive A:
.CE and press ENTER when ready . . .`;

const PRINTER = { on: false };
// lay a document out as paper rows: each row is { cells: [[ch, fg]...] } across the 60 printable columns
function paperRows(text) {
  const rows = [], PW = 60;
  const plain = (s) => ({ cells: [...s.slice(0, PW)].map(c => [c, rnd() < 0.05 ? LGR : DGR]), text: s });
  // the big face is set in pixels, two to a row; lines of it that follow one another are set solid with one pixel of
  // lead between them, the way a headline is, rather than a blank line apart
  let px = null;
  const flushBig = () => {
    if (!px) return;
    if (px.length % 2) px.push(new Array(PW).fill(false));
    for (let r = 0; r < px.length; r += 2) {
      const cells = [];
      for (let x = 0; x < PW; x++) { const t = px[r][x], b = px[r + 1][x]; cells.push([t && b ? '█' : t ? '▀' : b ? '▄' : ' ', DGR]); }
      rows.push({ cells, text: '█'.repeat(PW), big: true });
    }
    px = null;
  };
  for (const raw of text.split('\n')) {
    const l = raw.replace(/\r/g, '');
    if (l.startsWith('.BIG')) {
      const s = l.slice(4).trim().toUpperCase();
      if (px) px.push(new Array(PW).fill(false)); else px = [];
      let x0 = Math.max(0, Math.floor((PW - bigWidth(s)) / 2));
      const band = Array.from({ length: 6 }, () => new Array(PW).fill(false));
      for (const c of s) {
        const g = BIGF[c] || BIGF[' '];
        for (let r = 0; r < 6; r++) for (let i = 0; i < g[0].length; i++) if (g[r][i] === '#' && x0 + i < PW) band[r][x0 + i] = true;
        x0 += g[0].length + 1;
      }
      px.push(...band);
      continue;
    }
    flushBig();
    if (l.startsWith('.CE')) { const s = l.slice(3).trim(); rows.push(plain(' '.repeat(Math.max(0, Math.floor((PW - s.length) / 2))) + s)); continue; }
    if (l.startsWith('.BANNER')) {
      // Print Shop, more or less: the letters lie on their sides, tops to the right, and the paper reads downward
      const s = l.slice(7).trim().toUpperCase();
      for (const c of s) {
        const g = BIGF[c] || BIGF[' '], gw = g[0].length, sx = 3, sy = 9;           // each glyph pixel: 3 rows long, 9 columns across
        for (let gx = 0; gx < gw; gx++) for (let k = 0; k < sx; k++) {
          const cells = [];
          for (let x = 0; x < PW; x++) {
            const gy = Math.floor((PW - 4 - x) / sy);                               // the top of the letter at the right edge
            const on = gy >= 0 && gy < 6 && x < PW - 4 && g[gy][gx] === '#';
            cells.push([on ? '█' : ' ', DGR]);
          }
          rows.push({ cells, text: '█'.repeat(PW), big: true });
        }
        for (let k = 0; k < 3; k++) rows.push({ cells: [], text: '' });
      }
      continue;
    }
    rows.push(plain(l));
  }
  flushBig();
  return rows;
}

// the printer and the paper coming out of it, as one screen. st: the paper so far (done rows, the row on the platen and how
// much of it is printed, which way the head is going, how far the paper has been fed past the last row)
const PRN_PX = 10, PRN_VIS = 17;                  // printable columns start; rows of paper visible above the head
function drawPrinterView(st, docs) {
  cls(DGR, K0);
  // the paper, from the top of the screen down into the printer
  const top = st.done.length + (st.cur ? 1 : 0);
  for (let y = 0; y <= PRN_VIS; y++) {
    const ri = top - 1 - (PRN_VIS - y) + st.feed;          // the row of paper at screen row y
    fill(6, y, 68, 1, ' ', DGR, WHT);
    // tractor holes and perforations
    const hole = ((ri + 1000) % 2) === 0;
    put(6, y, hole ? '○' : ' ', LGR, WHT); put(73, y, hole ? '○' : ' ', LGR, WHT);
    put(8, y, ':', LGR, WHT); put(71, y, ':', LGR, WHT);
    if (ri >= 0 && ri % 33 === 32) for (let x = 9; x < 71; x += 2) put(x, y, '-', LGR, WHT);
    let row = null, n = 60;
    if (ri >= 0 && ri < st.done.length) row = st.done[ri];
    else if (st.cur && ri === st.done.length) { row = st.cur; n = st.curN; }
    if (!row) continue;
    for (let i = 0; i < row.cells.length; i++) {
      const printed = row === st.cur ? (st.dir > 0 ? i < n : i >= row.cells.length - n) : true;
      if (!printed) continue;
      const [c, fg] = row.cells[i];
      if (c !== ' ') put(PRN_PX + i, y, c, row.big ? DGR : fg, WHT);
    }
  }
  // the printer: a beige case, the platen, the head on its rail
  fill(2, 18, 76, 7, ' ', DGR, LGR);
  put(2, 18, '▄'.repeat(76), LGR, K0);
  put(4, 19, '▀'.repeat(72), K0, LGR);
  fill(6, 19, 68, 1, '▀', WHT, K0);                    // the paper going in
  const hx = PRN_PX + Math.max(0, Math.min(59, Math.round(st.headX)));
  put(hx - 1, 18, '▐█▌', K0, DGR); put(hx, 17, '▄', DGR, WHT);
  put(5, 21, 'L E C T E R N    L X - 9', DGR, LGR);
  put(5, 22, 'nine pin  ·  draft  ·  tractor', DGR, LGR);
  put(50, 21, 'ON LINE', DGR, LGR); put(58, 21, '•', (Math.floor(NOW / 500) % 2 || !st.cur) ? LGN : GRN, LGR);
  put(50, 22, 'POWER', DGR, LGR); put(58, 22, '•', LGN, LGR);
  put(62, 21, '[FORM FEED]', DGR, LGR); put(62, 22, '[LINE FEED]', DGR, LGR);
  fill(0, 24, 80, 1, ' ', DGR, K0);
  const D = docs[Math.min(st.doc, docs.length - 1)];
  if (D) put(1, 24, 'PRINT  ' + (D.full || D.name) + (docs.length > 1 ? '    ' + (Math.min(st.doc, docs.length - 1) + 1) + ' of ' + docs.length + ' in queue' : ''), DGR, K0);
  put(66, 24, 'Esc = back', DGR, K0);
}

PRINTER.run = async function (o = {}) {
  const prev = BASE;
  // one document, or a queue of them (PRINT takes several names); they come out one after another on the same paper
  const docs = o.docs || [{ dir: o.dir, name: o.name || 'BULLETIN.TXT', full: o.full, text: o.text }];
  const st = { done: [], cur: null, curN: 0, dir: 1, headX: 0, stop: false, feed: 0, t0: NOW, doc: 0 };
  const PX = PRN_PX;
  const P = () => (o.src === 'you' ? 1 : G.pace());
  PRINTER.on = true;
  const view = { name: 'printer', draw() { drawPrinterView(st, docs); } };
  BASE = view;
  const h = { modal: true, key(ev) { if (ev.k === 'Esc' && ev.src === 'you') st.stop = true; return true; }, mouse() { return true; } };
  pushH(h);
  try {
    const budget = o.ms ? o.ms : 1e9, t0 = NOW;
    for (let d = 0; d < docs.length && !st.stop && NOW - t0 < budget; d++) {
      const D = docs[d], f = D.dir ? fsFind(D.dir, D.name) : null;
      const rows = paperRows(D.text || TEXTS[D.name] || binaryText(D.name, f ? f.size : 2048));
      if (d > 0) {
        // top of form: the paper runs up to the next perforation before the next file
        st.cur = null;
        while (st.done.length % 33 !== 0) { st.done.push({ cells: [], text: '' }); if (st.done.length % 2 === 0) AU.printFeed(1); await wait(16); }
        await wait(260 * P());
      }
      st.doc = d;
      for (let i = 0; i < rows.length && !st.stop && NOW - t0 < budget; i++) {
        const r = rows[i];
        const n = r.cells.length;
        st.cur = r; st.curN = 0;
        const ink = r.cells.filter(c => c[0] !== ' ').length;
        if (!ink) { AU.printFeed(1); st.done.push(r); st.cur = null; await wait(70 * P()); continue; }
        const secs = (r.big ? 0.22 : 0.09 + n / 230) * P();
        AU.printLine(r.cells.map(c => c[0]).join(''), secs, r.big ? 1.2 : 1);
        const tl = NOW;
        while (NOW - tl < secs * 1000) {
          const k = (NOW - tl) / (secs * 1000);
          st.curN = Math.ceil(n * k);
          st.headX = st.dir > 0 ? n * k : n - n * k;
          await wait(16);
        }
        st.curN = n;
        st.done.push(r); st.cur = null;
        st.dir = -st.dir;                                  // bidirectional: the next line comes back the other way
        AU.printFeed(1);
        await wait(45 * P());
      }
    }
    // form feed: the paper runs up so it can be torn off
    if (!st.stop) {
      for (let k = 0; k < 6; k++) { st.feed++; AU.printFeed(1); await wait(55); }
      await wait((o.hold || 1300) * P());
    }
  } finally { popH(h); BASE = prev; PRINTER.on = false; }
};

async function cmdPrint(args, src) {
  if (!STATE.printTSR) {
    if (!/\/D:\S+/i.test(args)) {                       // /D:PRN answers the question before it is asked
      T.write('Name of list device [PRN]: ');
      await G.answerLine('', { kind: 'print', wait: 900, style: 'fast' });
    }
    STATE.printTSR = true;
    out('Resident part of PRINT installed');
    out('');
  }
  // the demonstration leaves PRINT doing what PRINT is for: printing in the background while the night goes on
  const bg = MODE === 'pre' && /^ghost/.test(src || '');
  const specs = args.replace(/\/\w+(:\S+)?/g, '').trim().split(/\s+/).filter(Boolean);
  if (!specs.length) { out('PRINT queue is empty'); return; }
  const docs = [];
  for (const spec of specs) {
    const full = resolve(spec), { dir, name } = splitFile(full);
    const f = fsFind(dir, name);
    if (!f || f.dir) { out('File not found - ' + full); continue; }
    out('    ' + full + (docs.length || (bg && SPOOL.busy()) ? ' is in queue' : ' is currently being printed'));
    docs.push({ dir, name, full });
  }
  if (!docs.length) return;
  if (bg) { SPOOL.queue(docs); if (typeof SEEN !== 'undefined') SEEN.add('print'); return; }
  await wait(500 * G.pace());
  if (typeof SEEN !== 'undefined') SEEN.add('print');
  const budget = STATE.printMs || (/^ghost/.test(src) ? 9000 + 8000 * (docs.length - 1) : 0);
  await PRINTER.run({ docs, src, ms: budget });
}

// ---- 17_demo.js
// PREDESTINATION is a self-running demonstration, the kind that ran on a loop in the window of a computer store in 1992:
// lesson cards, captions in a box, and a hand on the keyboard that is not yours. Press any key and it lets you drive;
// stop, and it carries on from where it was going to be anyway.

const DEMO = { on: false, caps: [], card: null, taken: false, seenYou: -1e9, nLessons: 11, quietUntil: 0 };
// a dissolve order for the cards: every cell gets a number, low numbers change first
const DISSOLVE = new Float32Array(N);
(function () { let h = 0x9e3779b9; for (let k = 0; k < N; k++) { h ^= h << 13; h >>>= 0; h ^= h >>> 17; h ^= h << 5; h >>>= 0; DISSOLVE[k] = (h / 4294967296) * 0.75 + ((k % W) / W) * 0.25; } })();

// a caption: a few dry lines in a box. at: 'top' | 'bottom' | 'mid' | 'left' | 'right' | 'topright' | {x, y}
// retired: the machine is not narrated. kept as a no-op so nothing that calls it breaks.
DEMO.say = function () { return null; };
DEMO._sayOld = function (lines, o = {}) {
  if (!DEMO.on || FX.off) return null;
  lines = Array.isArray(lines) ? lines : [lines];
  const chars = lines.join(' ').length;
  const ms = o.ms || Math.min(5200, 1500 + chars * 42);
  if (!o.keep) DEMO.caps = DEMO.caps.filter(c => c.sticky);
  const c = { lines, at: o.at || 'bottom', t0: NOW, until: NOW + ms, sticky: !!o.sticky };
  DEMO.caps.push(c);
  if (o.sound !== false) AU.on && AU.beep(1568, 0.025, 0.25);
  return c;
};
DEMO.clear = function () { DEMO.caps = []; };
function capBox(c) {
  const w = Math.max(...c.lines.map(l => l.length)) + 4, h = c.lines.length + 2;
  let x = Math.floor((W - w) / 2), y = 16 - h;
  const at = c.at;
  if (at === 'top') y = 2;
  else if (at === 'mid') y = Math.floor((25 - h) / 2) - 1;
  else if (at === 'bottom') y = 21 - h;
  else if (at === 'left') { x = 3; y = 9; }
  else if (at === 'right') { x = W - w - 3; y = 9; }
  else if (at === 'topright') { x = W - w - 2; y = 2; }
  else if (at === 'botright') { x = W - w - 2; y = 21 - h; }
  else if (typeof at === 'object') { x = at.x; y = at.y; }
  return { x: Math.max(0, Math.min(W - w, x)), y: Math.max(0, Math.min(23 - h, y)), w, h };
}
DEMO.drawCaps = function () {
  DEMO.caps = DEMO.caps.filter(c => NOW < c.until);
  for (const c of DEMO.caps) {
    const b = capBox(c);
    // it unrolls: the box opens over a quarter second, as the cheap demo programs drew them
    const k = Math.min(1, (NOW - c.t0) / 240), hh = Math.max(2, Math.round(b.h * k));
    const fade = c.until - NOW < 260;
    box(b.x, b.y, b.w, hh, 's', fade ? BRN : YEL, BRN);
    shadow(b.x, b.y, b.w, hh);
    if (k >= 1) c.lines.forEach((l, i) => put(b.x + 2, b.y + 1 + i, l, i === 0 && c.lines.length > 1 && /^[A-Z]/.test(l) ? WHT : YEL, BRN));
  }
};

// the lesson card: blue, big letters, a verse, and the line about the keyboard
function cardBuf(n, title, sub, verse, ref) {

DEMO.drawCard = function () {

  PROV.ran.add(h.k); PROV.nudges++;
