};

// when you have gone for a while, it drives: runs one thing you have not seen, then hands back
PROV.takeover = async function () {
  if (!PROV.inNC()) return;
  const pick = [
    ['term', async () => { await G.cmd('term', 'slow'); }],
    ['defrag', async () => { await G.cmd('defrag', 'slow'); }],
    ['zzt', async () => S_zzt()],
    ['advent', async () => { await G.cmd('advent', 'slow'); }],
    ['print', async () => { await G.cmd('print c:\\church\\' + pick2(['bridge', 'homecomg', 'sing', 'romanrd']) + '.txt', 'slow'); }],
    ['harrow', async () => { await G.cmd('harrow', 'slow'); }],
    ['msd', async () => { await G.cmd('msd', 'slow'); }],
    ['msav', async () => { await G.cmd('msav', 'slow'); }],
    ['fro', async () => { await G.cmd('qbasic \\uz\\job\\toandfro', 'slow'); }],
    ['tithe', async () => { await G.cmd('tithe', 'slow'); }],
  ].find(([k]) => !SEEN.has(k) && !PROV.ran.has(k));
  const job = pick ? pick[1] : (async () => { await G.cmd(pick2(['defrag', 'term', 'harrow']), 'slow'); });
  if (pick) PROV.ran.add(pick[0]);
  PROV.tookOver++;
  G.ownsRun = true;
  PROV.box(['You stepped away.', 'I\'ll keep the machine busy.', 'Take it back whenever.'], { ms: 4200, style: 'take' });
  try { await job(); } catch (e) { if (!(e instanceof Abort)) console.error(e); }
  G.ownsRun = false;
};
function pick2(a) { return a[Math.floor(rnd() * a.length)]; }

// the loop, started when free will begins
PROV.start = function () {
  if (PROV.on) return;
  PROV.on = true; PROV.startedFree = NOW; PROV.lastHelp = NOW; PROV.tookOver = 0; PROV.nudges = 0; PROV.ran.clear();
  (async () => {
   try {
    await PROV.greet();
    for (;;) {
      if (!STATE.freehand || REBOOTING || FX.off) { await wait(500); if (REBOOTING || FX.off) return; continue; }
      await wait(800);
      if (G.youBusy(1200) || !PROV.inNC()) { PROV.lastHelp = Math.max(PROV.lastHelp, NOW - 20000); continue; }
      // idleness is measured from the last thing you did, or from when free will began if you have not done anything yet
      const quiet = NOW - Math.max(KB.lastYou, PROV.startedFree);
      // a gentle nudge or two while you poke around; after that it stops talking and starts doing
      if (quiet > 18000 && quiet < 74000 && NOW - PROV.lastHelp > 26000) { await PROV.nudge(); PROV.lastHelp = NOW; continue; }
      // gone a good while: take over, now and then, and only while there is still something to show
      if (quiet > 74000 && NOW - PROV.lastHelp > 30000 && PROV.tookOver < 5) { await PROV.takeover(); PROV.lastHelp = NOW; continue; }
      // gone for the night: run JOB.BAT yourself, the way the predestination would have
      if (quiet > 240000 && !STATE.jobRunning && !STATE.jobDone) {
        PROV.box(['It is getting on toward midnight.', 'I\'ll finish for you.'], { ms: 5000, style: 'take' });
        await wait(1500);
        try { await G.cmd('job', 'slow'); } catch (e) { if (e instanceof Abort) throw e; }
      }
    }
   } catch (e) { if (!(e instanceof Abort)) console.error(e); }
   finally { PROV.on = false; PROV.pop = null; }        // the night ended; the next one starts its own
  })();
};
PROV.show = async function (mode, src) {

  out('');

  out('   It greets, it suggests, and if you leave it finishes.');
  out('   It cannot change the ending.  It has read the ending.');
  out('');
};

// DoubleSpace, pointed at a single file. LZ compression finds what repeats.
async function cmdDblspace(args, src) {
  const a = args.replace(/\/\w+/g, '').trim();
  if (!a) {
    out(''); out('DoubleSpace: drive C is not compressed.'); out('Compression ratio:  1.0 to 1'); out('');
    out('To see how one file would compress, type DBLSPACE and its name.'); out(''); return;
  }
  const full = resolve(a), { dir, name } = splitFile(full), f = fsFind(dir, name);
  if (!f || f.dir) { out('File not found - ' + name); return; }
  SEEN.add('dblspace');
  out(''); out('DoubleSpace is examining ' + full + ' . . .');
  T.write('  ');
  for (let i = 0; i < 30; i++) { T.write('█'); if (i % 6 === 0) AU.hdd(1, 0.05); await wait(45 * G.pace()); }
  T.nl(); out('');
  const soul = name === 'SOUL.DAT' || /^SKINJOB/.test(name);
  const zipped = /\.(ZIP|GIF|ARJ|LZH)$/.test(name);
  const n = soul ? Math.max(1, CHK_COUNT) : zipped ? 1 : 2;
  const ratio = soul || zipped ? n + '.0' : '1.' + String(3 + (f.size % 6));
  out('     Original size:  ' + padL(commas(f.size), 9) + ' bytes');
  out('   Compressed size:  ' + padL(commas(Math.ceil(f.size / parseFloat(ratio))), 9) + ' bytes');
  out(' Compression ratio:  ' + ratio + ' to 1');
  out('');
  if (soul && n === 1) { out('DoubleSpace found no repeated sequences.'); out('Nothing in ' + name + ' has happened before.'); }
  else if (soul) { out('DoubleSpace found one sequence, repeated ' + n + ' times:'); out('Saturday, 11:55 p.m. to midnight.'); }
  else if (zipped) out('This file is already compressed.  Nothing more comes out of it.');
  out('');
}

// QBasic, as it came with DOS 5 and 6, and the one program the night user wrote in it. "Whence comest thou? Then Satan
// answered the LORD, and said, From going to and fro in the earth, and from walking up and down in it." (Job 1:7)
// A walking game on the 80x50 half-block grid, the way the sample games drew theirs. The field is fenced with a hedge
// (1:10: "Hast not thou made an hedge about him"). Reach J, then O, then B, and the program asks its one question.

TEXTS['TOANDFRO.BAS'] = `' TOANDFRO.BAS -- whence comest thou?
DECLARE SUB Walk (d AS INTEGER)
DEFINT A-Z
CONST WALKUP = 1, WALKDOWN = 2, GOINGTO = 3, GOINGFRO = 4
DIM SHARED considered
COLOR 7, 0: CLS
PRINT "WHENCE COMEST THOU?"
d = GOINGFRO
DO
  SELECT CASE INKEY$
    CASE CHR$(0) + "H": d = WALKUP
    CASE CHR$(0) + "P": d = WALKDOWN
    CASE CHR$(0) + "K": d = GOINGTO
    CASE CHR$(0) + "M": d = GOINGFRO
  END SELECT
  Walk d
LOOP UNTIL considered
PRINT "HAST THOU CONSIDERED MY SERVANT JOB?"
' from going to and fro in the earth, and from walking up and down in it`;

async function cmdQbasic(args, src) {
  const autorun = /\/run/i.test(args);
  const a = args.replace(/\/\w+/g, '').trim();
  if (!a) { await QB.run({ src, file: 'UNTITLED' }); return; }
  let full = resolve(/\.\w+$/.test(a) ? a : a + '.BAS');
  let { dir, name } = splitFile(full);
  if (!fsFind(dir, name)) { out('File not found'); return; }
  await QB.run({ src, file: name, autorun });
}

      if (st.phase === 'menu') for (let i = 0; i < 5; i++) if (ev.y === 5 + i * 3 && ev.x >= 6 && ev.x < 26) { st.sel = i; press(i); }
      if (ev.y === 24) press(4);

  };
  let scanReq = null;
  function press(i) {
    st.sel = i; AU.key('enter', 0.5);
    if (i === 0 || i === 1) scanReq = i;

    else if (i === 4) st.done = true;
  }
  async function scan(clean) {
    const t0 = NOW;
    st.phase = 'mem'; st.pct = 0; st.msg = null;
    for (let p = 0; p <= 100 && !st.abort; p += 5) {
      st.pct = p; if (p % 20 === 0) AU.hdd(1, 0.05);

        st.found = {}; st.ffocus = 0; pending = null;
        AU.beep(880, 0.12, 0.7); after(160, () => AU.beep(660, 0.18, 0.7)); after(340, () => AU.beep(880, 0.12, 0.7));
        if (ghost) after(1700 * P(), () => { if (st.found && !pending && !G.youBusy(1500)) { AU.key('k', 0.5); pending = 'C'; } });

    st.phase = 'files';

      const a = all[i];

        changed = a;

        st.vfocus = 0; pending = null;
        AU.beep(880, 0.12, 0.7); after(160, () => AU.beep(660, 0.18, 0.7));
        if (ghost) after(1400 * P(), () => { if (st.verify && !pending && !G.youBusy(1500)) { AU.key('k', 0.5); pending = 'U'; } });
        for (;;) {

  BASE = view; pushH(h); MSAV.on = true;
  AU.hdd(10, 0.9);

    if (ghost) {

    }

// ---- 22_vsafe.js
// VSafe, as it came with DOS 6: a resident guard with eight things it watches for, a window on Alt-V, and a box that asks
// Stop, Continue or Boot when one of them happens. On this machine it is the hedge. "Hast not thou made an hedge about
// him, and about his house, and about all that he hath on every side?" (Job 1:10). AUTOEXEC.BAT puts it up every night.
// JOB.BAT takes it down.

const VSAFE = { on: false, opts: null, open: false };
const VSAFE_NAMES = ['HD Low level format', 'Resident', 'General write protect', 'Check executable files',
  'Boot sector viruses', 'Protect HD boot sector', 'Protect FD boot sector', 'Protect executable files'];
// what whoever set this machine up asked it to watch: everything, except stopping every write, which would stop the saving
VSAFE.reset = function () { VSAFE.on = false; VSAFE.opts = [true, true, false, true, true, true, true, true]; VSAFE.open = false; };
VSAFE.reset();

function vsafeBox(st) {
  const x = 16, y = 4, w = 48, h = 17;
  box(x, y, w, h, 'd', WHT, BLU, ' VSafe Warning Options ', YEL, BLU); shadow(x, y, w, h);
  put(x + 4, y + 2, 'Warning type', LCY, BLU); put(x + w - 8, y + 2, 'On', LCY, BLU);
  put(x + 2, y + 3, '─'.repeat(w - 4), LCY, BLU);
  VSAFE_NAMES.forEach((n, i) => {
    const on = st.opts[i], lead = ' ' + '.'.repeat(Math.max(1, 30 - n.length));
    put(x + 4, y + 4 + i, String(i + 1), YEL, BLU);
    put(x + 8, y + 4 + i, n + lead, on ? WHT : LGR, BLU);
    put(x + w - 7, y + 4 + i, on ? 'X' : ' ', YEL, BLU);
  });
  put(x + 4, y + 13, st.msg || 'Press 1-8 to toggle a warning.', st.msg ? YEL : LGR, BLU);
  put(x + 4, y + 14, 'ESC returns.  Alt-U unloads VSafe.', LGR, BLU);
}

// the window. o.script drives it when nobody is at the keys
VSAFE.window = async function (o = {}) {
  if (VSAFE.open || !VSAFE.on) return 'closed';
  VSAFE.open = true;
  if (typeof SEEN !== 'undefined') SEEN.add('vsafe');
  const st = { opts: VSAFE.opts, msg: null, done: false, unload: false };
  const L = { draw() { vsafeBox(st); } };
  const h = {
    modal: true,
    key(ev) {
      if (ev.src === 'you') KB.lastYou = NOW;
      if (ev.k === 'Esc') { st.done = true; return true; }
      if (ev.alt && (ev.code === 'KeyU' || (ev.ch || '').toLowerCase() === 'u')) { st.unload = true; st.done = true; return true; }
      const n = ev.ch && /^[1-8]$/.test(ev.ch) ? +ev.ch : (ev.code && /^Digit[1-8]$/.test(ev.code) ? +ev.code.slice(5) : 0);
      if (n) { st.opts[n - 1] = !st.opts[n - 1]; AU.key('k', 0.5); }
      return true;
    },
    mouse(ev) {
      if (ev.type === 'down') { const i = ev.y - 8; if (i >= 0 && i < 8 && ev.x > 16 && ev.x < 63) { st.opts[i] = !st.opts[i]; AU.key('k', 0.5); } }
      return true;
    },
  };
  addLayer(L); pushH(h);
  AU.beep(1318, 0.05, 0.45);
  try {
    if (o.script) await o.script(st);
    while (!st.done) await wait(50);
  } finally { popH(h); delLayer(L); VSAFE.open = false; }
  if (st.unload) { VSAFE.on = false; return 'unloaded'; }
  return 'closed';
};

// when something it watches for happens: Stop, Continue, or Boot (start the machine again)
VSAFE.warn = async function (lines, o = {}) {
  if (typeof SEEN !== 'undefined') SEEN.add('vsafe');
  const BS = ['Stop', 'Continue', 'Boot'];
  const st = { f: 0, res: null };
  const w = 54, h = 7 + lines.length, x = Math.floor((W - w) / 2), y = 7;
  const L = {
    draw() {
      box(x, y, w, h, 'd', WHT, RED, ' VSafe Warning ', YEL, RED); shadow(x, y, w, h);
      lines.forEach((l, i) => put(x + 3, y + 2 + i, l, WHT, RED));
      let bx = x + 9;
      BS.forEach((b, i) => {
        const on = i === st.f;
        put(bx, y + h - 3, ' ' + b + ' ', on ? WHT : K0, on ? K0 : LGR);
        put(bx + b.length + 2, y + h - 3, '▄', K0, RED); put(bx + 1, y + h - 2, '▀'.repeat(b.length + 2), K0, RED);
        bx += b.length + 8;
      });
    },
  };
  const h_ = {
    modal: true,
    key(ev) {
      if (ev.src === 'you') KB.lastYou = NOW;
      const c = (ev.ch || '').toUpperCase();
      if (ev.k === 'Left') st.f = (st.f + 2) % 3;
      else if (ev.k === 'Right' || ev.k === 'Tab') st.f = (st.f + 1) % 3;
      else if (ev.k === 'Enter') st.res = BS[st.f][0];
      else if (ev.k === 'Esc') st.res = 'S';
      else if (c === 'S' || c === 'C' || c === 'B') { st.f = 'SCB'.indexOf(c); st.res = c; }
      return true;
    },
    mouse(ev) {
      if (ev.type !== 'down') return true;
      let bx = x + 9;
      BS.forEach((b, i) => { if (ev.y === y + h - 3 && ev.x >= bx && ev.x < bx + b.length + 2) { st.f = i; st.res = b[0]; } bx += b.length + 8; });
      return true;
    },
  };
  addLayer(L); pushH(h_);
  for (let i = 0; i < 3; i++) after(i * 180, () => AU.beep(i % 2 ? 660 : 880, 0.12, 0.7));
  if (o.ghost) after(o.ghostAfter || 2500, () => { if (!st.res) { AU.key('k', 0.5); st.res = o.ghost; } });
  try { while (!st.res) await wait(50); } finally { popH(h_); delLayer(L); }
  AU.key('enter', 0.5);
  return st.res;
};

// the command
async function cmdVsafe(args, src) {
  if (/\/u\b/i.test(args)) {
    if (!VSAFE.on) { out('VSafe is not loaded.'); return; }
    if (/^ghost/.test(src)) {
      // the batch takes the hedge down where it can be seen: one warning at a time, then the whole thing out of memory
      const P = () => G.pace();
      await VSAFE.window({
        script: async (st) => {
          await wait(650 * P());
          for (let i = 0; i < 8; i++) {
            if (!st.opts[i]) continue;
            st.opts[i] = false; AU.key('k', 0.45);
            await wait(150 * P());
          }
          await wait(380 * P());
          st.msg = 'Removing VSafe from memory . . .';
          await wait(520 * P());
          st.unload = true; st.done = true;
        },
      });
    }
    VSAFE.on = false; VSAFE.open = false;
    out('VSafe removed from memory.');
    return;
  }
  if (VSAFE.on) { out('VSafe is already loaded.'); return; }
  VSAFE.reset(); VSAFE.on = true;
  AU.hdd(3, 0.2);
  out('Hotkey: <Alt><V>');
  out('VSafe successfully installed.');
}

// ---- 23_whirl_art.js
// What the whirlwind shows. Open one of the topics in WHIRL that is about the world, and it does not describe the thing,
// it runs it: a demonstration, drawn the way a VGA demo of 1992 drew things, sixteen colours and a pixel at a time.
// "Then the LORD answered Job out of the whirlwind, and said . . ." (Job 38:1). None of it is an answer to anything Job asked.

// a small fixed generator, so the drawings do not disturb the night's own dice
function lcg(seed) { let s = seed >>> 0 || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }
function pline(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let g = 0; g < 400; g++) {
    pset(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
const ease = (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k));
const WHIRL_ART = {};

// ---- FOUNDATN: the earth on its foundations, turning, with the line stretched upon it (Job 38:4-5)
WHIRL_ART.FOUNDATN = {
  syn: 'FOUNDATN /MEASURES /LINE', foot: 'Where wast thou when I laid the foundations of the earth?',
  enter() { AU.drone(4, 0.5, 36.7); },
  draw(t) {
    const R = 20, cx = 40, cy = 25, rot = t / 1500, tilt = 0.41, ct = Math.cos(tilt), st = Math.sin(tilt);
    const pts = [];
    const pt = (lat, lon, c, cb) => {
      const la = lat * Math.PI / 180, lo = lon * Math.PI / 180 + rot;
      const x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
      const y2 = y * ct - z * st, z2 = y * st + z * ct;
      pts.push([z2, cx + x * R, cy - y2 * R, z2 > 0 ? c : cb]);
    };
    for (let lon = 0; lon < 360; lon += 30) for (let lat = -88; lat <= 88; lat += 3) pt(lat, lon, LCY, BLU);
    for (let lat = -60; lat <= 60; lat += 30) for (let lon = 0; lon < 360; lon += 2.5) pt(lat, lon, lat ? LCY : CYN, BLU);
    // the line, stretched upon it: drawn out round the equator, a measure at a time
    const reach = Math.min(360, t / 7);
    for (let lon = 0; lon < reach; lon += 1.5) pt(0, lon - rot * 180 / Math.PI - 90, YEL, BRN);
    pts.sort((a, b) => a[0] - b[0]);
    for (const [, x, y, c] of pts) pset(Math.round(x), Math.round(y), c);
    // the pillars it stands on (Job 9:6), and nothing they stand on
    for (const px of [31, 49]) for (let py = 44; py < 48; py++) pset(px, py, DGR);
  },
};

// ---- SEA: the points that do not escape. "Hitherto shalt thou come, but no further: and here shall thy proud waves be
// stayed" (Job 38:11). The waves come in band by band, white where they break, and stop where the set begins.
let SEA_IT = null;
function seaIters() {
  if (SEA_IT) return SEA_IT;
  const PW = 80, PH = 50, MAXI = 48, cx = -0.6, cy = 0, sc = 3.05 / PW;
  SEA_IT = new Int16Array(PW * PH);
  for (let py = 0; py < PH; py++) for (let px = 0; px < PW; px++) {
    const x0 = cx + (px - PW / 2 + 0.5) * sc, y0 = cy + (py - PH / 2 + 0.5) * sc;
    let x = 0, y = 0, n = 0;
    while (n < MAXI && x * x + y * y <= 4) { const xt = x * x - y * y + x0; y = 2 * x * y + y0; x = xt; n++; }
    SEA_IT[py * PW + px] = n >= MAXI ? -1 : n;
  }
  return SEA_IT;
}
WHIRL_ART.SEA = {
  syn: 'SEA /DOORS /BARS', foot: 'Hitherto shalt thou come, but no further.',
  enter() { AU.wind(3.4, 0.55); },
  draw(t) {
    const it = seaIters(), front = t / 52, WAVE = [BLU, BLU, LBL, CYN, LCY, CYN, LBL, BLU, BLU];
    const ph = Math.floor(t / 85);
    for (let py = 0; py < 50; py++) for (let px = 0; px < 80; px++) {
      const n = it[py * 80 + px];
      let c = K0;
      if (n >= 0 && n <= front) {
        if (front < 48 && front - n < 1.3) c = WHT;                                   // where it breaks
        else c = WAVE[((n - ph) % WAVE.length + WAVE.length) % WAVE.length];
      }
      pset(px, py, c);
    }
  },
};

// ---- PLEIADES and ORION: one sky. "Canst thou bind the sweet influences of Pleiades, or loose the bands of Orion?"
// (Job 38:31). Here a cord is drawn round the seven, and the three stars of the belt come apart.
const SKYF = (() => { const r = lcg(1992); const s = []; for (let i = 0; i < 90; i++) s.push([Math.floor(r() * 80), 2 + Math.floor(r() * 46), r()]); return s; })();
// Orion from the sky itself (west to the right, as you face south), a degree to 1.9 pixels; Aldebaran and the seven are
// set further in than they are, so that the question fits on one screen
const ORI = [['Betelgeuse', 1.2, 7.4, LRD, 2], ['Bellatrix', 8.7, 6.3, WHT, 1], ['Meissa', 6.2, 9.9, LGR, 0],
  ['Alnitak', 4.8, -1.9, WHT, 1], ['Alnilam', 6.0, -1.2, WHT, 1], ['Mintaka', 7.0, -0.3, WHT, 1],
  ['Saiph', 3.0, -9.7, LGR, 1], ['Rigel', 11.4, -8.2, LCY, 2]];
const ORI_LINES = [[0, 1], [0, 2], [1, 2], [0, 3], [1, 5], [3, 4], [4, 5], [3, 6], [5, 7]];
const PLEI = [[0, 0], [2, -1], [4, -1], [5, 1], [3, 2], [1, 2], [6, 0]];
function skyDraw(t, bind, loose) {
  for (const [x, y, ph] of SKYF) pset(x, y, Math.sin(t / 260 + ph * 40) > 0.6 ? LGR : DGR);
  const k = ease((t - 500) / 2600) * loose;
  const P = ORI.map(([n, xd, dd, c, sz]) => [18 + xd * 1.9, 27 - dd * 1.9, c, sz]);
  // the bands, loosed: Alnitak east and down, Mintaka west and up
  P[3][0] -= 6 * k; P[3][1] += 2.2 * k; P[5][0] += 6 * k; P[5][1] -= 2.2 * k;
  for (const [a, b] of ORI_LINES) pline(P[a][0], P[a][1], P[b][0], P[b][1], (a >= 3 && a <= 5 && b <= 5 && b >= 3) ? BLU : DGR);
  for (const [x, y, c, sz] of P) {
    const tw = Math.sin(t / 180 + x) > 0.85, X = Math.round(x), Y = Math.round(y);
    pset(X, Y, tw ? WHT : c);
    if (sz >= 1) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) pset(X + dx, Y + dy, c === LRD ? RED : sz >= 2 ? CYN : BLU);
  }
  // Aldebaran, the eye of the bull, between them
  pset(54, 14, LRD); for (const [dx, dy] of [[1, 0], [-1, 0]]) pset(54 + dx, 14 + dy, RED);
  // the seven, and the cord round them, drawn a length at a time
  const px0 = 63, py0 = 6;
  const tied = Math.min(PLEI.length, Math.floor(ease((t - 300) / 2400) * PLEI.length * bind + 0.0001));
  for (let i = 0; i < tied; i++) { const [ax, ay] = PLEI[i], [bx, by] = PLEI[(i + 1) % PLEI.length]; pline(px0 + ax * 1.8, py0 + ay * 1.6, px0 + bx * 1.8, py0 + by * 1.6, CYN); }
  for (const [x, y] of PLEI) pset(Math.round(px0 + x * 1.8), Math.round(py0 + y * 1.6), Math.sin(t / 150 + x * 3) > 0.7 ? WHT : LCY);
}
WHIRL_ART.PLEIADES = { syn: 'PLEIADES /BIND', foot: 'Canst thou bind the sweet influences of Pleiades?', enter() {}, draw(t) { skyDraw(t, 1, 0.35); } };
WHIRL_ART.ORION = { syn: 'ORION /LOOSE', foot: 'Canst thou loose the bands of Orion?', enter() {}, draw(t) { skyDraw(t, 0.4, 1); } };

// ---- LIGHTNIN: three strokes, and the last one answers. "Canst thou send lightnings, that they may go, and say unto
// thee, Here we are?" (Job 38:35)
function boltPath(r, x0) {
  const path = [];
  let x = x0, y = 7;
  while (y < 45) {
    path.push([x, y]);
    const s = r();
    x += s < 0.3 ? -1 : s < 0.6 ? 1 : 0; if (r() < 0.18) x += r() < 0.5 ? -1 : 1;
    y += 1;

      let fx = x, fy = y; const d = r() < 0.5 ? -1 : 1, n = 3 + Math.floor(r() * 8);
      for (let i = 0; i < n; i++) { fx += d * (r() < 0.6 ? 1 : 0); fy += 1; path.push([fx, fy, 1]); }
    }

}
const RAIN = (() => { const r = lcg(3835); const a = []; for (let i = 0; i < 110; i++) a.push([r() * 96, r() * 60, 36 + r() * 20]); return a; })();
WHIRL_ART.LIGHTNIN = {
  syn: 'LIGHTNIN', foot: 'Canst thou send lightnings, that they may go?',
  enter(a) {
    const r = lcg(Math.floor(rnd() * 1e9) + 7);
    a.strokes = [380, 1350, 2250].map((at, i) => ({ at, path: boltPath(r, (i === 2 ? 30 : 12) + Math.floor(r() * (i === 2 ? 20 : 56))), near: [0.55, 0.8, 1][i] }));
    a.ep = EPOCH; a.open = true;
    for (const s of a.strokes) after(s.at, () => { if (a.ep === EPOCH && a.open) AU.thunder(s.near); });
    if (AU.on) AU.wind(3.4, 0.3);
  },
  leave(a) { a.open = false; },
  draw(t, a) {
    const last = a.strokes.filter(s => t >= s.at).pop(), age = last ? t - last.at : 1e9;

// ---- 24_wind.js
// "And, behold, there came a great wind from the wilderness, and smote the four corners of the house, and it fell upon
// the young men" (Job 1:19). Moving HOUSE anywhere takes it through the wilderness: the box that reports the move loses
// a corner with each file it reports, and when it has none left it comes down.

const WIND = { on: false };
WIND.house = async function (pd, moves) {
  const R = lcg(1019 + moves.length);

  // in the air it turns over, a quarter at a time.
  const CHUNK = [[['╔', '═'], ['║', ' ']], [['═', '╗'], [' ', '║']], [[' ', '║'], ['═', '╝']], [['║', ' '], ['╚', '═']]];
  const at = (i) => [i % 2 ? pd.x + pd.w - 2 : pd.x, i < 2 ? pd.y : pd.y + pd.h - 2];      // top-left cell of corner i
  const base = pd.draw;

    if (gone) return;

    for (let i = 0; i < 4; i++) if (blown[i]) {
      const [x, y] = at(i);
      for (let j = 0; j < 4; j++) { const cx = x + (j & 1), cy = y + (j >> 1); if (inb(cx, cy)) { const k = idx(cx, cy); keep.push([k, B.ch[k], B.fg[k], B.bg[k]]); } }
    }

  };

  const x0 = pd.x;
  const L = {
    draw() {
      const B = TGT;
      for (const s of streaks) { const x = Math.round(s.x), y = Math.round(s.y); if (inb(x, y) && B.ch[idx(x, y)] === 32) put(x, y, s.c, s.fg, null); }
      for (const d of dust) { const x = Math.round(d.x), y = Math.round(d.y); if (inb(x, y)) put(x, y, d.life > 7 ? '▒' : '░', d.life > 4 ? LGR : DGR, null); }

      for (const f of flyers) {
        const x = Math.round(f.x), y = Math.round(f.y), c = CHUNK[(f.r | 0) & 3];
        for (let j = 0; j < 4; j++) put(x + (j & 1), y + (j >> 1), c[j >> 1][j & 1], WHT, LGR);
      }
    },

  const SAND = ['·', '·', '∙', '.', ',', '`', "'", '·', '-'];
  const tick = () => {
    tk = null;
    const n = gust * 3.2;
    for (let i = 0; i < n; i++) if (R() < n - i) {
      const c = SAND[(R() * SAND.length) | 0];
      streaks.push({ x: -R() * 4, y: R() * (H - 1), v: 1.4 + R() * 3.4 * gust, vy: (R() - 0.5) * 0.25, c, fg: R() < 0.45 ? BRN : R() < 0.6 ? YEL : LGR });
    }
    for (let i = streaks.length - 1; i >= 0; i--) { const s = streaks[i]; s.x += s.v; s.y += s.vy; if (s.x > W) streaks.splice(i, 1); }
    for (let i = flyers.length - 1; i >= 0; i--) {
      const f = flyers[i];
      f.vx = Math.min(3.2, f.vx + 0.2); f.x += f.vx; f.vy += (R() - 0.55) * 0.18; f.y += f.vy; f.r += 0.34;

    tk = after(40, tick);

    await wait(350);
    gust = 0.7;
    for (let i = 0; i < moves.length; i++) {
      pd.lines = [{ t: moves[i][0], x: 3, y: 2 }, { t: 'to', x: 3, y: 3 }, { t: moves[i][1], x: 3, y: 4 }];
      AU.hdd(2, 0.1);
      await wait(360);

        blown[i] = true;
        const [cx, cy] = at(i);

    }
    await wait(250);
    // and with no corners it comes down
    falling = true; pd.x = x0;
    let vy = 0, y = pd.y;
    const floor = H - pd.h;
    while (pd.y < floor) {
      vy += 0.16; y = Math.min(floor, y + vy); pd.y = Math.round(y);

    }

    if (tk) cancel(tk);
    delLayer(L); WIND.on = false;
  }
};

        const x = Math.round(X0 + gw * g + gw / 2), y = Y0 - Math.round(val(c, r) / max * H_);
        jobs.push(() => { if (px != null) gline(px, py, x, y, LEG[si][1]); tiMark(x, y, LEG[si][1], si); px = x; py = y; });
      });
    });
  } else {
    rows.forEach((r, g) => series.forEach((c, si) => {
      const h = Math.round(val(c, r) / max * H_), x = Math.round(X0 + gw * g + (gw - (bw * 3 + gap * 2)) / 2 + si * (bw + gap));
      jobs.push(() => { if (h > 0) { tiSwatch(x, Y0 - h, bw, h, LEG[si][1], si); } });
    }));
  }
  if (o.instant) jobs.forEach(f => f());
  return jobs;
}
// fills: the first series solid, the second cross-hatched, the third solid with a white edge
function tiSwatch(x, y, w, h, c, si) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const edge = i === 0 || j === 0 || i === w - 1 || j === h - 1;
    let on = true;
    if (si === 1) on = edge || ((i + j) % 4 === 0) || ((i - j + 64) % 4 === 0);
    gpset(x + i, y + j, si === 2 && edge ? 3 : on ? c : 0);
  }
}
function tiMark(x, y, c, si) {
  if (si === 0) grect(x - 2, y - 2, 5, 5, c);
  else if (si === 1) { gline(x - 3, y, x + 3, y, c); gline(x, y - 3, x, y + 3, c); }
  else { gline(x - 3, y, x, y - 3, c); gline(x, y - 3, x + 3, y, c); gline(x + 3, y, x, y + 3, c); gline(x, y + 3, x - 3, y, c); }
}

async function cmdTithe(args, src) {

// The rack in the vestibule. PRINT stays resident and prints while you do other things; in the demonstration the night
// user sends every pamphlet to the printer first thing, and the queue runs on behind everything else whether anyone is
// watching or not. Now and then the camera turns round to the paper: a sheet torn off, held up, put down.

TEXTS['PAMPHLET.BAT'] = `@ECHO OFF
REM  the rack in the vestibule, one of each, in the order they go out
PRINT /D:PRN /Q:11 C:\\CHURCH\\FOURATTR.TXT C:\\CHURCH\\ROMANRD.TXT C:\\CHURCH\\RAPTURE.TXT C:\\CHURCH\\SING.TXT
PRINT C:\\CHURCH\\HOMECOMG.TXT C:\\CHURCH\\NOTEBURN.TXT C:\\CHURCH\\BRIDGE.TXT C:\\CHURCH\\WATCHNT.TXT
PRINT C:\\CHURCH\\FUND.TXT C:\\CHURCH\\TWOWAYS.TXT C:\\CHURCH\\BANNER.TXT`;

// a batch file with nothing in it but commands (JOB.BAT, with its labels and its choices, has an interpreter of its own)
async function runSmallBatch(dir, name, src) {
  if (!fsFind(dir, name)) { AU.hdd(2, 0.15); out('Bad command or file name'); return; }
  let echo = true;
  for (const raw of (TEXTS[name] || '').split('\n')) {
    let line = raw.trim();
    if (!line) continue;
    const at = line.startsWith('@'); if (at) line = line.slice(1);
    const U = line.toUpperCase();
    if (U === 'ECHO OFF') { echo = false; continue; }
    if (U === 'ECHO ON') { echo = true; continue; }
    if (U.startsWith('REM')) continue;
    if (echo && !at) { T.nl(); T.write(T.promptStr() + line); T.nl(); }
    await RUN(line, src);
  }
}

// ---------------------------------------------------------------- the queue, printing on its own
const SPOOL = { st: null, docs: [], on: false, peekLoud: 0 };
SPOOL.reset = function () { SPOOL.st = null; SPOOL.docs = []; SPOOL.on = false; SPOOL.peekLoud = 0; };
SPOOL.busy = () => !!(SPOOL.st && SPOOL.st.phase !== 'idle');
SPOOL.queue = function (docs) {
  for (const D of docs) {
    const f = D.dir ? fsFind(D.dir, D.name) : null;
    SPOOL.docs.push(Object.assign({}, D, { rows: paperRows(D.text || TEXTS[D.name] || binaryText(D.name, f ? f.size : 2048)), start: -1, end: -1 }));
  }
  if (!SPOOL.st || SPOOL.st.phase === 'idle') {
    const old = SPOOL.st;
    SPOOL.st = old || { done: [], cur: null, curN: 0, dir: 1, headX: 0, feed: 0, doc: 0, i: 0, phase: 'next', tl: 0, step: 0 };
    SPOOL.st.phase = 'next'; SPOOL.st.tl = 0;
  }
  SPOOL.on = true;
};
// how loud the printer is: in the room it is a long way off; when we turn round to it, it is there
SPOOL.loud = () => Math.max(SPOOL.peekLoud, PAGE.cur ? 0.4 : 0);
SPOOL.tick = function (dt) {
  const st = SPOOL.st;
  if (!SPOOL.on || !st || FX.off) return;
  let left = dt;
  for (let guard = 0; guard < 400 && left > 0; guard++) {
    if (st.tl > 0) {
      const used = Math.min(st.tl, left);
      st.tl -= used; left -= used;
      if (st.phase === 'print') {
        const r = st.cur, n = r.cells.length, k = 1 - st.tl / st.step;
        st.curN = Math.ceil(n * k); st.headX = st.dir > 0 ? n * k : n - n * k;
      }
      if (st.tl > 0) break;
      // the step just ended
      if (st.phase === 'print') {
        st.curN = st.cur.cells.length; st.done.push(st.cur); st.cur = null; st.dir = -st.dir;
        if (SPOOL.loud()) AU.printFeed(1);
        st.phase = 'gap'; st.tl = 45; st.step = 45; continue;
      }
      if (st.phase === 'tof') { st.done.push({ cells: [], text: '' }); st.phase = st.done.length % 33 ? 'tof' : 'tofwait'; st.tl = st.phase === 'tof' ? 16 : 260; st.step = st.tl; continue; }
      if (st.phase === 'feed') { st.feed++; st.ff = (st.ff || 0) + 1; if (st.ff < 6) { st.tl = 55; st.step = 55; continue; } st.phase = 'idle'; return; }
      st.phase = 'row';
    }
    if (st.phase === 'idle') return;
    if (st.phase === 'next') {
      if (st.doc >= SPOOL.docs.length) { st.phase = 'feed'; st.ff = 0; st.tl = 55; st.step = 55; continue; }
      st.i = 0;
      if (st.done.length % 33 !== 0 && st.done.length > 0) { st.phase = 'tof'; st.tl = 16; st.step = 16; continue; }
      st.phase = 'row';
    }
    if (st.phase === 'tofwait' || st.phase === 'gap' || st.phase === 'blank') st.phase = 'row';
    if (st.phase === 'row') {
      const D = SPOOL.docs[st.doc];
      if (st.i === 0 && D.start < 0) D.start = st.done.length;
      if (st.i >= D.rows.length) { D.end = st.done.length; st.doc++; st.phase = 'next'; continue; }
      const r = D.rows[st.i++];
      const ink = r.cells.filter(c => c[0] !== ' ').length;
      if (!ink) { st.done.push(r); if (SPOOL.loud()) AU.printFeed(1); st.phase = 'blank'; st.tl = 70; st.step = 70; continue; }
      const secs = r.big ? 0.22 : 0.09 + r.cells.length / 230;
      st.cur = r; st.curN = 0; st.phase = 'print'; st.tl = secs * 1000; st.step = st.tl;
      const lv = SPOOL.loud();
      if (lv) AU.printLine(r.cells.map(c => c[0]).join(''), secs, (r.big ? 1.2 : 1) * lv);
    }
  }
};
ANIM.add((dt) => SPOOL.tick(dt));

// turning round to the printer for a moment
PRINTER.peek = async function (ms) {
  if (!SPOOL.st) return;
  const prev = BASE;
  BASE = { name: 'printer', draw() { drawPrinterView(SPOOL.st, SPOOL.docs); } };
  SPOOL.peekLoud = 1;
  let quit = false;
  const h = { modal: true, key(ev) { if (ev.src === 'you') quit = true; return true; }, mouse(ev) { if (ev.type === 'down' && ev.src === 'you') quit = true; return true; } };
  pushH(h);
  try { const t0 = NOW; while (NOW - t0 < ms && !quit) await wait(40); }
  finally { popH(h); BASE = prev; SPOOL.peekLoud = 0; }
};

// ---------------------------------------------------------------- a sheet, held up
// drawn over everything else, the screen and whatever is running on it, which carries on underneath
const PAGE = { cur: null };
PAGE.doc = (name) => SPOOL.docs.findIndex(D => D.name === name);
PAGE.ready = (name) => { const d = PAGE.doc(name); return d >= 0 && SPOOL.docs[d].start >= 0; };
// show a printed pamphlet for ms; o.leaf: it is turned over onto the one before; o.keep: leave it up for the next one
PAGE.show = function (name, ms = 2000, o = {}) {
  const d = PAGE.doc(name);
  if (d < 0 || SPOOL.docs[d].start < 0 || FX.off) return Promise.resolve(false);
  return new Promise(res => {
    const prev = PAGE.cur;
    const cur = { d, t0: NOW, ms, res, prev: prev && o.leaf ? prev : null, leaf: !!o.leaf, out: 0 };
    PAGE.cur = cur;
    if (prev && prev !== cur) prev.res(true);
    if (o.leaf) AU.leaf(1); else AU.tear(1);
    after(ms, () => {
      if (PAGE.cur !== cur) return;
      if (o.keep) { res(true); return; }
      cur.out = NOW;                                          // put down: it drops out of the bottom of the picture
      after(150, () => { if (PAGE.cur === cur) { PAGE.cur = null; AU.leaf(0.5); } res(true); });
    });
  });
};
PAGE.hide = function () { const c = PAGE.cur; if (!c) return; PAGE.cur = null; c.res(true); };
// several, one after another, each laid on the last
PAGE.flip = async function (names, each = 1700) {
  const have = names.filter(PAGE.ready);
  for (let i = 0; i < have.length; i++) await PAGE.show(have[i], each, { leaf: i > 0, keep: i < have.length - 1 });
};
// a key from whoever is at the machine puts the paper down at once
PAGE.hideOnYou = function () { if (PAGE.cur && KB.lastYou > PAGE.cur.t0) PAGE.hide(); };
ANIM.add(() => PAGE.hideOnYou());

function drawPageAt(c, oy) {
  const D = SPOOL.docs[c.d], st = SPOOL.st;
  const last = D.end >= 0 ? D.end : st.done.length;            // a sheet still coming out is as far along as it has got
  for (let y = Math.max(0, oy); y < 25; y++) {
    const r = y - oy;
    fill(0, y, 80, 1, ' ', DGR, K0);
    if (r === 0) { put(6, y, '▄'.repeat(68), WHT, K0); continue; }   // the torn edge
    const ri = D.start + r - 1;
    fill(6, y, 68, 1, ' ', DGR, WHT);
    const hole = ((ri + 1000) % 2) === 0;
    put(6, y, hole ? '○' : ' ', LGR, WHT); put(73, y, hole ? '○' : ' ', LGR, WHT);
    put(8, y, ':', LGR, WHT); put(71, y, ':', LGR, WHT);
    if (ri % 33 === 32) for (let x = 9; x < 71; x += 2) put(x, y, '-', LGR, WHT);
    if (ri >= last) continue;
    const row = st.done[ri];
    if (!row) continue;
    for (let i = 0; i < row.cells.length; i++) { const [ch, fg] = row.cells[i]; if (ch !== ' ') put(PRN_PX + i, y, ch, row.big ? DGR : fg, WHT); }
  }
}
PAGE.draw = function () {
  const c = PAGE.cur;
  if (!c) return;
  const tin = Math.min(1, (NOW - c.t0) / 170), up = 1 - Math.pow(1 - tin, 3);
  let oy = Math.round((1 - up) * 25);
  if (c.out) oy = Math.round(Math.min(1, (NOW - c.out) / 150) * 25);
  if (c.prev && tin < 1) drawPageAt(c.prev, 0);
  if (c.banner) { drawBannerAt(c, oy); CUR.vis = false; MS.show = false; return; }
  drawPageAt(c, oy);
  if (oy === 0) {
    const D = SPOOL.docs[c.d];
    fill(0, 24, 80, 1, ' ', DGR, K0);
    put(1, 24, 'PRINT  ' + (D.full || D.name) + '    ' + (c.d + 1) + ' of ' + SPOOL.docs.length, DGR, K0);
  }
  CUR.vis = false; MS.show = false;
};

// ---------------------------------------------------------------- the banner, unrolled
// Print Shop sets the letters on their sides down a strip of fanfold; held up the other way it reads across, and it is
// longer than anything that will hold it, so it goes past. After it, the right way up, whatever else was in the file.
const BANNER_TEXT = 'PREPARE TO MEET THY GOD', BANNER_S = 2;
function bannerColumns() {
  const cols = [];
  for (const ch of BANNER_TEXT) {
    const g = BIGF[ch] || BIGF[' '];
    for (let i = 0; i < g[0].length; i++) { let bits = 0; for (let r = 0; r < 6; r++) if (g[r][i] === '#') bits |= 1 << r; for (let s = 0; s < BANNER_S; s++) cols.push(bits); }
    for (let s = 0; s < BANNER_S; s++) cols.push(0);
  }
  return cols;
}
PAGE.banner = function (ms = 3400) {
  const d = PAGE.doc('BANNER.TXT');
  if (d < 0 || SPOOL.docs[d].start < 0 || FX.off) return Promise.resolve(false);
  return new Promise(res => {
    const prev = PAGE.cur; if (prev) prev.res(true);
    const cur = { d, t0: NOW, ms, res, banner: true, cols: bannerColumns(), out: 0 };
    PAGE.cur = cur;
    AU.tear(1);
    after(ms, () => {
      if (PAGE.cur !== cur) return;
      cur.out = NOW;
      after(150, () => { if (PAGE.cur === cur) { PAGE.cur = null; AU.leaf(0.5); } res(true); });
    });
  });
};
function drawBannerAt(c, oy) {
  const tail = ['Insert new diskette for drive A:', 'and press ENTER when ready . . .'];
  const total = c.cols.length + 6 + tail[0].length;            // the letters, a gap, and the two lines after them
  const k = Math.min(1, (NOW - c.t0) / c.ms), e = k * k * (3 - 2 * k) * 0.25 + k * 0.75;
  const x0 = Math.round(8 + (72 - total - 8) * e);             // from its first letters at the left to its last lines at the right
  const top = 5 + oy, bot = 19 + oy;
  for (let y = Math.max(0, oy); y < 25; y++) fill(0, y, 80, 1, ' ', DGR, K0);
  for (let y = top; y <= bot; y++) {
    if (y < 0 || y > 24) continue;
    fill(0, y, 80, 1, ' ', DGR, WHT);
    for (let x = 0; x < 80; x++) {
      const px = x - x0;                                       // the paper's own column, so the holes and folds go past with it
      if (y === top || y === bot) { if (((px % 2) + 2) % 2 === 0) put(x, y, '○', LGR, WHT); }
      else if (y === top + 1 || y === bot - 1) { put(x, y, '·', LGR, WHT); }
      else if (((px % 66) + 66) % 66 === 0) put(x, y, ':', LGR, WHT);   // a fold of the fanfold
    }
  }
  // the letters, in half-block pixels, six tall at twice the size
  const py0 = (top + 3) * 2;
  for (let x = 0; x < 80; x++) {
    const i = x - x0;
    if (i < 0 || i >= c.cols.length) continue;
    const bits = c.cols[i];
    for (let r = 0; r < 6; r++) if (bits & (1 << r)) for (let s = 0; s < BANNER_S; s++) pset(x, py0 + r * BANNER_S + s + oy * 0, DGR);
  }
  const tx = x0 + c.cols.length + 6;
  tail.forEach((l, j) => { for (let i = 0; i < l.length; i++) { const x = tx + i; if (x >= 0 && x < 80) put(x, top + 6 + j, l[i], DGR, WHT); } });
}

// ---- 27_power.js
// The machine before it is on. Whoever opens the page finds it switched off on the desk: the monitor dark, the case, the
// red rocker. The first key or click is a thumb on that rocker, and it is also the touch the browser waits for before it
// will let a page make a sound, so the switch, the fan, the degaussing and the drives spinning up all arrive at once.
// Nobody comes for a while and it turns itself on anyway, without the sound. It was going to.

const POWER = { state: 'off', t0: 0, fx: null, by: null };

// the glass of the monitor in the drawing, in cells and in the 640x400 bitmap (it has the screen's own proportions, so the
// zoom ends exactly on it)
const GLASS = { x: 24, y: 1, w: 32, h: 10, px: 192, py: 16, pw: 256, ph: 160 };

POWER.draw = function () {
  const on = POWER.state === 'on', t = NOW - POWER.t0;
  cls(LGR, K0);
  // ---- the desk, at night
  for (let px = 0; px < 80; px++) pset(px, 44, BRN);
  // ---- the monitor
  const bx0 = 21, bx1 = 58, by0 = 0, by1 = 25;                          // the bezel, in half-block pixels
  for (let py = by0; py <= by1; py++) for (let px = bx0; px <= bx1; px++) {
    const corner = (px === bx0 || px === bx1) && (py === by0 || py === by1);
    if (corner) continue;
    let c = LGR;
    if (py === by0 || px === bx0) c = WHT;
    else if (py === by1 || px === bx1) c = DGR;
    pset(px, py, c);
  }
  // the recess round the glass: in shadow above and to the left, catching the light below and to the right
  const gx0 = GLASS.x - 1, gx1 = GLASS.x + GLASS.w, gy0 = GLASS.y * 2 - 1, gy1 = (GLASS.y + GLASS.h) * 2;
  for (let px = gx0; px <= gx1; px++) { pset(px, gy0, DGR); pset(px, gy1, WHT); }
  for (let py = gy0; py <= gy1; py++) { pset(gx0, py, DGR); pset(gx1, py, WHT); }
  pset(gx1, gy0, LGR); pset(gx0, gy1, LGR);
  // the glass
  const G0 = GLASS.y * 2, G1 = (GLASS.y + GLASS.h) * 2 - 1, mid = (G0 + G1) >> 1;
  for (let py = G0; py <= G1; py++) for (let px = GLASS.x; px < GLASS.x + GLASS.w; px++) pset(px, py, K0);
  // its corners, curved
  for (const [cx, cy, sx, sy] of [[GLASS.x, G0, 1, 1], [GLASS.x + GLASS.w - 1, G0, -1, 1], [GLASS.x, G1, 1, -1], [GLASS.x + GLASS.w - 1, G1, -1, -1]]) {
    pset(cx, cy, DGR); pset(cx + sx, cy, DGR); pset(cx, cy + sy, DGR);
  }
  if (!on) {
    // switched off it is a mirror for the room: the tube light over the desk, and a glint at the corner
    for (let px = 33; px <= 45; px += 2) pset(px, G0 + 2, DGR);
    pset(26, G0 + 5, DGR); pset(27, G0 + 4, DGR); pset(28, G0 + 3, DGR); pset(29, G0 + 2, DGR);
    pset(26, G0 + 7, DGR); pset(27, G0 + 6, DGR);
  } else if (t > 520) {
    // and on, the beam finding itself: a line across the middle of the tube, drawn out from the centre
    const half = Math.min(15, Math.floor((t - 520) / 22));
    for (let px = 40 - half; px < 40 + half; px++) pset(px, mid, Math.abs(px - 39.5) < half - 3 ? WHT : LGR);
  }
  // the strip under the glass: two knobs, and the monitor's own lamp
  pset(46, 23, DGR); pset(48, 23, DGR);
  pset(53, 23, on ? LGN : DGR);
  // the stand
  for (let px = 33; px <= 46; px++) pset(px, 26, DGR);
  for (let px = 34; px <= 45; px++) pset(px, 27, LGR);

  // ---- the case
  const cx0 = 3, cx1 = 76, cy0 = 28, cy1 = 43;
  for (let py = cy0; py <= cy1; py++) for (let px = cx0; px <= cx1; px++) {
    const corner = (px === cx0 || px === cx1) && (py === cy0 || py === cy1);
    if (corner) continue;
    let c = LGR;
    if (py === cy0 || px === cx0) c = WHT;
    else if (py === cy1 || px === cx1) c = DGR;
    pset(px, py, c);
  }
  // the badge, pressed into the plastic
  bigText(6, 15, '286XL+', DGR, LGR);
  // the lamps
  const hddOn = on && t > 300 && (((t / 70) | 0) * 2654435761 >>> 0) % 100 < (t < 1500 ? 45 : 20);
  const fdOn = on && t > 900 && t < 1700;
  put(6, 19, '■', on ? LGN : DGR, LGR); put(8, 19, 'POWER', DGR, LGR);
  put(15, 19, '■', on ? YEL : DGR, LGR); put(17, 19, 'TURBO', DGR, LGR);
  put(24, 19, '■', hddOn ? LRD : DGR, LGR); put(26, 19, 'HDD', DGR, LGR);
  // the buttons, and the key that locks the keyboard
  put(31, 19, ' TURBO ', LGR, DGR); put(39, 19, ' RESET ', LGR, DGR);
  for (let px = 32; px <= 38; px++) pset(px, 40, DGR);
  for (let px = 40; px <= 46; px++) pset(px, 40, DGR);
  put(38, 16, 'Θ', DGR, LGR);
  // drive A: a 5.25" drive with the tract still in it, its lever turned down across the slot
  fill(48, 15, 21, 3, ' ', LGR, DGR);
  for (let px = 49; px <= 66; px++) pset(px, 32, K0);
  for (let py = 30; py <= 35; py++) pset(58, py, LGR);
  pset(67, 31, fdOn ? LGN : K0);
  put(63, 17, '1.2M', LGR, DGR);
  // drive B: nothing behind it
  frame(48, 18, 21, 3, 's', DGR, LGR);
  // the power switch: a red rocker. off, the I side stands up; on, it is pressed in and lit from inside.
  fill(71, 15, 5, 5, ' ', K0, DGR);
  if (!on) {
    put(72, 16, ' I ', WHT, LRD);
    put(72, 17, '▄▄▄', RED, LRD);
    put(72, 18, ' O ', LRD, RED);
  } else {
    const lit = t >= 90;
    put(72, 16, ' I ', lit ? YEL : WHT, lit ? LRD : RED);
    put(72, 17, '▀▀▀', lit ? LRD : RED, lit ? LRD : RED);
    put(72, 18, ' O ', lit ? WHT : LRD, lit ? LRD : RED);
    if (lit) for (const [x, y] of [[71, 16], [75, 16], [71, 17], [75, 17], [71, 18], [75, 18]]) put(x, y, '░', RED, DGR);
  }
  put(71, 20, 'POWER', DGR, LGR);

  // ---- the keyboard, the one with the springs in it
  for (let px = 6; px <= 73; px++) {
    pset(px, 45, (px === 6 || px === 73) ? LGR : WHT);
    for (let py = 46; py <= 48; py++) {
      const gap = py === 47 || (py === 46 && (px - 7) % 3 === 2) || (py === 48 && (px < 26 || px > 50) && (px - 7) % 3 === 2);
      pset(px, py, px === 6 || px === 73 ? LGR : gap ? DGR : LGR);
    }
    pset(px, 49, DGR);
  }
  for (const px of [54, 55, 62]) for (let py = 46; py <= 48; py++) pset(px, py, DGR);   // the gaps before the arrows and the keypad
  pset(65, 46, on ? LGN : DGR); pset(68, 46, on ? LGN : DGR); pset(71, 46, DGR);          // its three lamps
};

// the switch, thrown: the lamps and the noise, a moment of the room, then into the glass and the tube coming on
POWER.throwSwitch = async function (o = {}) {
  POWER.state = 'on'; POWER.t0 = NOW; POWER.by = o.by || 'you';
  AU.machWanted = true;
  if (AU.on) { AU.roomOn(0.5); AU.powerOn({ switch: true }); }
  await wait(1100);
  POWER.fx = { kind: 'zoom', t0: NOW, ms: 620 };
  await wait(640);
  POWER.fx = null;
};
// the tube: a line that opens into a picture, a touch too big before it settles, brightening as the cathode warms
POWER.crtOn = function (ms = 950) { POWER.fx = { kind: 'crt', t0: NOW, ms }; };

// the first boot: wait for a hand, or for a browser that already allows sound, or for nobody at all
POWER.gate = async function () {
  const show = Q.get('panel') === '1' || (!MANUAL && Q.get('panel') !== '0');
  if (!show) { POWER.state = 'on'; AU.machWanted = true; if (AU.on) AU.powerOn({}); POWER.crtOn(); return; }
  const prev = BASE;
  BASE = { name: 'power', draw: POWER.draw };
  POWER.state = 'off'; POWER.t0 = NOW;
  AU.init();
  let by = null;
  const h = {
    modal: true,
    key(ev) { if (ev.src === 'you' && !by) by = 'you'; return true; },
    mouse(ev) { if (ev.type === 'down' && ev.src === 'you' && !by) by = 'you'; return true; },
  };
  pushH(h);
  try {
    const t0 = NOW;
    while (!by) {
      if (AU.on && NOW - t0 > 1100) by = 'sound';                 // this browser already lets it make a sound
      else if (NOW - t0 > (+Q.get('selfon') || 15000)) by = 'self';
      await wait(40);
    }
    if (by === 'you') { const tw = NOW; while (!AU.on && AU.ctx && !AU.muted && NOW - tw < 450) await wait(16); }
    await POWER.throwSwitch({ by });
  } finally { popH(h); BASE = prev; }
  POWER.crtOn();
};

// drawn over the bitmap as it goes to the window
POWER.drawFx = function (ctx) {
  const fx = POWER.fx;
  if (!fx) return false;
  const k = (NOW - fx.t0) / fx.ms;
  if (fx.kind === 'zoom') {
    const e = ease(Math.min(1, Math.max(0, k)));
    const sx = GLASS.px * e, sy = GLASS.py * e, sw = 640 + (GLASS.pw - 640) * e, sh = 400 + (GLASS.ph - 400) * e;
    ctx.drawImage(VGA, sx, sy, sw, sh, VIEW.ox, VIEW.oy, VIEW.w, VIEW.h);
    return true;
  }
  if (k >= 1) { POWER.fx = null; return false; }
  const open = ease(Math.min(1, k / 0.16));
  const settle = k < 0.16 ? 1 : 1 + 0.022 * Math.exp(-(k - 0.16) * 6) * Math.cos((k - 0.16) * 18);
  const bright = Math.pow(Math.min(1, Math.max(0, (k - 0.04) / 0.62)), 0.8);
  const w = VIEW.w * settle, h = Math.max(2, VIEW.h * open * settle);
  const x = VIEW.ox + (VIEW.w - w) / 2, y = VIEW.oy + (VIEW.h - h) / 2;
  ctx.globalAlpha = bright;
  ctx.drawImage(VGA, 0, 0, 640, 400, x, y, w, h);
  ctx.globalAlpha = 1;
  const ra = 0.10 * Math.max(0, 1 - k * 1.4);
  if (ra > 0.005) { ctx.fillStyle = 'rgba(150,160,170,' + ra.toFixed(3) + ')'; ctx.fillRect(x, y, w, h); }
  const la = (1 - open) * 0.95;
  if (la > 0.01) { const lh = Math.max(2, VIEW.s * 2); ctx.fillStyle = 'rgba(235,245,255,' + la.toFixed(3) + ')'; ctx.fillRect(VIEW.ox, VIEW.oy + VIEW.h / 2 - lh / 2, VIEW.w, lh); }
  return true;
};

// ---- 28_ansi.js

// fire: heat rising from a bed of coals, cooling as it goes, a step every 1/35 s whatever the frame rate
function fireNew(w = 160, h = 56, seed = 7) { return { w, h, heat: new Float32Array(w * h), t: -1, r: lcg(seed) }; }

// the other fire, the way Doom drew it: every cell takes the heat of one below it, a little to one side, a little cooler
function fireStepDoom(F, o) {

// ---- 30_cncview.js
// HARROW.EXE: the pack's loader, then the pack, then the door. The loader is a demo in the way the packs came in, on the
// one voice the machine has; the pack is shown the way the viewers showed it, each file coming down the line or wiped or
// scrolled in on the beat; and at the end there is the door at the back, which was already open.

// ---------------------------------------------------------------- the tune: A minor, round and round, a kick and a snare
// on the same voice as the melody, the chords broken into arpeggios too fast to hear as anything but chords
const NOTE = (n) => {
  const m = /^([A-G])([#b]?)(\d)$/.exec(n);
  const base = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (base + (+m[3] - 4) * 12) / 12);
};
const CNC_BPM = 140, CNC_BEAT = 60000 / CNC_BPM;
const CNC_MEL = ('A5 - E6 - D6 C6 B5 . C6 - A5 - . . E5 . ' + 'F5 . A5 . C6 - D6 . C6 . A5 . . G5 A5 . ' +
  'D6 . F6 - E6 D6 C6 . A5 - . . D6 . F6 . ' + 'E6 - D6 . B5 - G#5 . E5 . G#5 . B5 . D6 .').trim().split(/\s+/);
const CNC_CHORDS = [['A4', 'C5', 'E5'], ['F4', 'A4', 'C5'], ['D4', 'F4', 'A4'], ['E4', 'G#4', 'B4']];
function cncTune() {
  if (!AU.on || !AU.ctx) return null;
  const ctx = AU.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = 440; g.gain.value = 0;
  o.connect(g); g.connect(AU.mus || AU.spk);
  const st = 60 / CNC_BPM / 4, T = { o, g, st, t0: AU.t() + 0.06, s: 0, cur: 0, done: false };
  o.start(T.t0 - 0.01);
  T.pump = () => { if (T.done) return; const until = AU.t() + 0.4; while (T.t0 + T.s * st < until) { cncStep(T, T.s, T.t0 + T.s * st); T.s++; } };
  T.pump();
  T.anim = () => T.pump();
  ANIM.add(T.anim);
  return T;
}
function cncStep(T, s, ts) {
  const f = T.o.frequency, gg = T.g.gain, st = T.st, m = CNC_MEL[s % 64], ch = CNC_CHORDS[Math.floor(s / 16) % 4];
  const VM = 0.065, VA = 0.04, VD = 0.08;
  let t = ts;
  if (s % 8 === 0) {                          // the kick: the pitch falling away
    f.setValueAtTime(190, t); f.exponentialRampToValueAtTime(42, t + 0.04);
    gg.setValueAtTime(VD, t); gg.linearRampToValueAtTime(VD * 0.5, t + 0.04);
    t += 0.042;
  } else if (s % 8 === 4) {                   // the snare: as near to noise as one voice comes
    for (let i = 0; i < 16; i++) f.setValueAtTime(700 + Math.random() * 3200, t + i * 0.0025);
    gg.setValueAtTime(VD * 0.8, t); gg.linearRampToValueAtTime(VD * 0.3, t + 0.04);
    t += 0.04;
  }
  if (m === '.') {
    const n = Math.max(1, Math.floor((ts + st - t) / 0.026));
    for (let i = 0; i < n; i++) f.setValueAtTime(NOTE(ch[(s * 2 + i) % 3]), t + i * 0.026);
    gg.setValueAtTime(VA, t);
    T.cur = 0;
  } else if (m === '-') {
    if (T.cur) { f.setValueAtTime(T.cur, t); gg.setValueAtTime(VM * 0.82, t); }
  } else {
    T.cur = NOTE(m);
    f.setValueAtTime(T.cur, t);
    gg.setValueAtTime(VM, t); gg.linearRampToValueAtTime(VM * 0.78, ts + st - 0.004);
  }
}
function cncTuneStop(T, fade = 0.08) {
  if (!T || T.done) return;
  T.done = true; ANIM.delete(T.anim);
  const t = AU.t();
  try {
    T.g.gain.cancelScheduledValues(t); T.o.frequency.cancelScheduledValues(t);
    T.g.gain.setValueAtTime(T.g.gain.value, t); T.g.gain.linearRampToValueAtTime(0, t + fade); T.o.stop(t + fade + 0.03);
  } catch (e) {}
}

// ---------------------------------------------------------------- the viewer
const CNCV = { PB: new Buf(), NB: new Buf(), stars: starsNew(170, 9) };
const CNC_SCROLL = '      cNc  .  THE LATTER-DAY PRIORS PRESENT  SOUL.ZIP  .  TEN FILES AND THE SOUL  .  GREETS TO AUGUSTINE  CALVIN  BAYES  MOLINA  AND THE REMNANT  .  NO GREETS TO PELAGIUS  .  YOUR PRIOR WAS SET BEFORE YOU WERE BORN  .  RUN HARROW.EXE  .  IT WAS GOING TO RUN ANYWAY  .  ';
let CNC_COLS = null;
function cncCols() {
  if (CNC_COLS) return CNC_COLS;
  const cols = [];
  for (const ch of CNC_SCROLL.toUpperCase()) {
    const g = BIGF[ch] || BIGF[' '];
    for (let i = 0; i < g[0].length; i++) { let bits = 0; for (let r = 0; r < 6; r++) if (g[r][i] === '#') bits |= 1 << r; cols.push(bits); }
    cols.push(0);
  }
  return (CNC_COLS = cols);
}
const CNC_RAIN = [LRD, YEL, LGN, LCY, LBL, LMG, WHT];
// the scroller: big letters on a sine, in every colour, with a shadow under them
function cncScroller(t, ybase, amp) {
  const cols = cncCols(), off = Math.floor(t / 1000 * 52);
  for (let pass = 0; pass < 2; pass++) for (let x = 0; x < W; x++) {
    const ci = (x + off) >> 1, bits = cols[ci % cols.length];
    if (!bits) continue;
    const yb = Math.round(ybase + Math.sin((x + t / 22) / 15) * amp), c = CNC_RAIN[Math.floor((ci + t / 90) / 5) % CNC_RAIN.length];
    for (let r = 0; r < 6; r++) if (bits & (1 << r)) { if (pass === 0) pset(x + 1, yb + r + 1, K0); else pset(x, yb + r, c); }
  }
}
// the tunnel's lining: a checkerboard going down it, turning, the empty set on every fourth ring
function cncTunnelTex(u, v, t) {
  const a = u * 8 + t / 2400, d = v + t / 260;
  const ring = Math.floor(d) % 6 === 0 && fract(d) < 0.45, ck = (Math.floor(a) + Math.floor(d)) & 1;
  if (ring) return fract(a * 2) < 0.5 ? [255, 85, 85] : [170, 0, 0];
  return ck ? [130, 0, 140] : [16, 0, 26];
}
// pieces drawn once off the screen before they are needed, so nothing stalls on the first frame of one
function cncWarm(i) {
  const P = CNC_PIECES[i];
  if (!P || P.warm) return;
  P.warm = true;
  onto(CNCV.NB, () => P.draw(1));
}
const CNC_TRANS = ['flash', 'type', 'wipe', 'scroll', 'dissolve', 'type', 'curtain', 'flash', 'wipe', 'scroll'];

function cncDraw(V) {
  const t = NOW - V.t0;

  if (V.flash != null) {
    const k = (NOW - V.flash) / (V.flashMs || 240);
    if (k >= 0 && k < 1) { palScale(k * k, [255, 255, 255]); V.pal = true; }
    else if (V.pal && k >= 1) { palReset(); V.pal = false; }
  }
  if (V.phase === 'presents') {
    cls(LGR, K0);
    const s = 'c N c     p r e s e n t s', x = Math.floor((W - s.length) / 2);
    for (let i = 0; i < Math.min(V.typed || 0, s.length); i++) { const age = (V.typed - i); put(x + i, 12, s[i], age > 6 ? WHT : age > 3 ? LGR : DGR, K0); }
    if ((V.typed || 0) < s.length && Math.floor(NOW / 120) % 2) put(x + (V.typed || 0), 12, '_', LGR, K0);

      outline: AP[K0], ow: 8, extrude: { dx: 3, dy: 4, n: 4, col: (f) => AP[f < 0.4 ? LBL : BLU] } });

    aQuant();

  if (V.phase === 'door') return cncDoorDraw(V);

}

function cncShowDraw(V) {
  const P = CNC_PIECES[V.i], tp = NOW - V.pt0, Tt = V.ghost ? 300 : 450, k = Math.min(1, tp / Tt);
  const NB = CNCV.NB, PB = CNCV.PB;

  const tr = V.trans;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let src = NB, edge = 0;
    if (k < 1) {
      if (tr === 'type') src = i < k * N ? NB : null;
      else if (tr === 'wipe') { const f = (x + y * 2.4) - k * (W + 62); src = f < 0 ? NB : PB; if (f >= 0 && f < 3) edge = 3 - Math.floor(f); }
      else if (tr === 'dissolve') src = ahash(x, y * 7) < k * 1.05 ? NB : PB;

        const j = (y - (H - off)) * W + x; S.ch[i] = NB.ch[j]; S.fg[i] = NB.fg[j]; S.bg[i] = NB.bg[j]; S.bl[i] = 0; continue;
      }
    }
    if (edge) { S.ch[i] = cp(edge === 3 ? '█' : edge === 2 ? '▓' : '░'); S.fg[i] = edge === 3 ? WHT : LCY; S.bg[i] = K0; S.bl[i] = 0; continue; }
    if (!src) { S.ch[i] = 32; S.fg[i] = LGR; S.bg[i] = K0; S.bl[i] = 0; continue; }
    S.ch[i] = src.ch[i]; S.fg[i] = src.fg[i]; S.bg[i] = src.bg[i]; S.bl[i] = 0;
  }
  if (tr === 'type' && k < 1) { const c = Math.floor(k * N); if (c < N) { S.ch[c] = cp('▄'); S.fg[c] = LGR; S.bg[c] = K0; } }

    put(0, 24, padR(s, W), WHT, BLU);
  }
}

// ---------------------------------------------------------------- the door at the back
const CNC_DOCTRINE = ['the soul is a file.', 'salvation is a copy operation.', '', 'your prior was set', 'before you were born.', '',
  'the evidence will not', 'update it.', '', 'we call this grace.'];
function cncDoorDraw(V) {
  const t = NOW - V.t0, open = V.bar < 0 ? 0 : Math.min(1, V.bar / 100), lk = 0.6 + 0.4 * open + 0.03 * Math.sin(t / 90);
  aFill([5, 3, 2]);
  // the wall of the dark room, in courses, barely there
  aRegion(0, 0, 640, 330, (px, py, k) => { const row = Math.floor(py / 26); if (fract((px + (row & 1) * 22) / 44) < 0.05 || fract(py / 26) < 0.08) aMix(k, [22, 13, 9], 1); });
  // the floor, and the light thrown across it from the doorway, widening toward us
  aRect(0, 330, 640, 400, [12, 7, 4]);
  aPoly([128, 330, 262, 330, 470, 400, 40, 400], [255 * lk, 190 * lk, 70 * lk], 0.75);
  aRegion(0, 330, 640, 400, (px, py, k) => aMul(k, 1 - (py - 330) / 110));
  // the doorway: white at its heart, going to gold at the jambs
  aRegion(128, 52, 262, 330, (px, py, k) => {
    const d = Math.abs(px - 195) / 67, c = ramp([[0, [255, 255, 255]], [0.45, [255, 248, 170]], [0.8, [240, 180, 50]], [1, [180, 90, 0]]], d);
    aMix(k, [c[0] * lk, c[1] * lk, c[2] * lk], 1);
  });
  // dust in the light
  for (let i = 0; i < 14; i++) { const px = 140 + ((i * 53 + t / 40) % 110), py = 70 + ((i * 97 + t / 26) % 250); aAdd(((py >> 3) * AFW + (px >> 2)) * 3, [80, 70, 40], 1); }
  aGlow(195, 190, 220, [255, 170, 40], 0.14 * lk, 230);
  // the door, swung open toward us on its left hinge: its face in shadow, its edge lit
  aPoly([128, 52, 70, 28, 70, 360, 128, 330], [120, 52, 8]);
  aPoly([118, 76, 82, 62, 82, 178, 118, 182], [70, 26, 2]); aPoly([118, 204, 82, 204, 82, 334, 118, 318], [70, 26, 2]);
  aPoly([70, 28, 78, 31, 78, 357, 70, 360], [255, 170, 40]);
  aDisc(90, 196, 5, [255, 220, 90], 1, 5);
  // the frame
  aRect(120, 44, 270, 52, [110, 56, 14]); aRect(120, 44, 128, 332, [90, 44, 10]); aRect(262, 44, 270, 332, [70, 30, 6]);
  aQuant({ pal: [K0, RED, BRN, LRD, YEL, WHT, DGR] });
  const tx = 38;
  put(tx, 2, 'C U L T   O F   T H E   N U L L   C O W', LCY, K0);
  put(tx, 3, '- the Latter-Day Priors -', DGR, K0);

  if (V.bar >= 0 && V.bar <= 100) { const n = Math.round(V.bar / 5); put(tx, 18, 'opening  [' + '#'.repeat(n) + '·'.repeat(20 - n) + ']', LCY, K0); }
  else if (V.bar > 100) put(tx, 18, 'the door was already open.', WHT, K0);

// ---------------------------------------------------------------- the run
HARROW.run = async function (o = {}) {
  const prev = BASE, ghost = /^ghost/.test(o.src || '');
  if (typeof PROV !== 'undefined') PROV.hide();                 // the pack takes the whole screen; the resident helper steps back
  const V = { phase: 'presents', t0: NOW, ghost, typed: 0, i: 0, nav: 0, skip: false, end: false, shown: 0, bar: -1, warm: 0, tune: null, pal: false };
  window.__harrow = V;
  BASE = { name: 'harrow', draw: () => cncDraw(V) };
  const h = {
    modal: true,
    key(ev) {
      if (ev.k === 'Esc') { if (V.phase === 'show' || V.phase === 'door') V.end = true; else V.skip = true; return true; }
      if (V.phase === 'show') {
        if (ev.k === 'Right' || ev.k === 'PgDn' || ev.k === ' ' || ev.k === 'Enter' || ev.k === 'Down') V.nav = 1;
        else if (ev.k === 'Left' || ev.k === 'PgUp' || ev.k === 'Backspace' || ev.k === 'Up') V.nav = -1;
      } else if (V.phase === 'door') { if (V.bar > 100) V.end = true; }
      else V.skip = true;
      return true;
    },
    mouse(ev) { if (ev.type === 'down') { if (V.phase === 'show') V.nav = 1; else if (V.phase === 'door') { if (V.bar > 100) V.end = true; } else V.skip = true; } return true; },
  };
  pushH(h);
  const until = async (ms, f) => { const t0 = NOW; while (NOW - t0 < ms && !(f && f())) await wait(30); };
  // in the demonstration the whole of it keeps to the night's pace, within reason; the files go by on the beat
  const pk = ghost ? Math.max(0.7, Math.min(1, G.pace())) : 1, short = ghost && G.pace() < 0.76;
  try {
    // the loader: who presents, then the tunnel and the scroller, then the name of the pack coming at you
    AU.degauss();
    const word = 'c N c     p r e s e n t s';
    for (let i = 0; i < word.length && !V.skip; i++) { V.typed = i + 1; if (word[i] !== ' ') AU.beep(1200 + i * 30, 0.018, 0.3); await wait(ghost ? 14 : 42); }
    await until(ghost ? 200 * pk : 650, () => V.skip);
    V.tune = cncTune();
    V.phase = 'tunnel'; V.t0 = NOW; V.flash = NOW; V.flashMs = 260;
    await until(ghost ? 2500 * pk : 9500, () => V.skip);
    V.skip = false;
    V.phase = 'title'; V.t0 = NOW; V.flash = NOW + 500; V.flashMs = 300;
    await until(ghost ? 900 * pk : 1400, () => V.skip);
    V.skip = false;
    // the pack: on the beat, three beats a file when nobody is turning the pages
    for (let i = 0; i < CNC_PIECES.length; i++) cncWarm(i);
    CNCV.PB.copyFrom(S);
    V.phase = 'show'; V.i = 0; V.pt0 = NOW; V.trans = CNC_TRANS[0]; V.flash = NOW; V.flashMs = 220;
    for (;;) {
      const P = CNC_PIECES[V.i], beats = short ? (P.beatsShort || 2) : (P.beats || 3);
      await until(ghost ? CNC_BEAT * beats : 7000, () => V.nav || V.end);
      if (V.end) break;
      const next = V.i + (V.nav || 1);
      V.nav = 0;
      if (next >= CNC_PIECES.length) break;
      if (next < 0) continue;
      CNCV.PB.copyFrom(S);
      V.i = next; V.pt0 = NOW; V.trans = CNC_TRANS[next % CNC_TRANS.length];
      if (V.trans === 'flash') { V.flash = NOW; V.flashMs = 200; }
      if (V.trans === 'type') AU.hdd(2, 0.05);
    }
    // the door
    cncTuneStop(V.tune, 0.6); V.tune = null;
    if (V.pal) { palReset(); V.pal = false; }
    V.flash = null; V.end = false;
    V.phase = 'door'; V.t0 = NOW;
    AU.drone(ghost ? 6 : 12, 0.5, 48);
    for (let i = 0; i < CNC_DOCTRINE.length && !V.end; i++) {
      V.shown = i + 1;
      if (CNC_DOCTRINE[i]) AU.key('k', 0.3);
      await until(CNC_DOCTRINE[i] ? (ghost ? 140 * pk : 620) : (ghost ? 50 : 240), () => V.end);
    }
    V.shown = CNC_DOCTRINE.length;
    for (V.bar = 0; V.bar <= 100 && !V.end; V.bar += 5) { if (rnd() < 0.4) AU.hdd(1, 0.05); await wait(ghost ? 18 : 80); }
    V.bar = 101; AU.beep(880, 0.12, 0.5);
    await until(o.hold || (ghost ? 850 * pk : 6000), () => V.end);
  } finally {
    cncTuneStop(V.tune);
    palReset();
    popH(h); BASE = prev;
  }
};

// ---- 99_main.js
// The frame loop.

console.assert(CP437.length === 256, 'cp437 table');
window.addEventListener('unhandledrejection', e => { if (e.reason instanceof Abort) e.preventDefault(); });
let _last = performance.now();
let MANUAL = Q.get('manual') === '1';
function frameStep(dt) {
  NOW += dt;
  runTimers();
  for (const f of ANIM) { try { f(dt); } catch (e) { console.error(e); } }
  compose();
}
function loop(t) {
  const dt = Math.min(100, Math.max(0, t - _last));
  _last = t;
  if (!MANUAL) frameStep(dt);
  present();
  requestAnimationFrame(loop);
}

// hooks for verification
window.__step = async function (ms, step = 16) {
  for (let t = 0; t < ms; t += step) {
    frameStep(Math.min(step, ms - t));
    for (let i = 0; i < 6; i++) await Promise.resolve();
  }
  present();
};
window.__text = () => screenText(S);
window.__state = () => ({ NOW, clock: fmtTime24(), date: fmtDateDOS(), base: BASE && BASE.name, layers: LAYERS.length, scene: (window.SCENE || '') });

function boot() {
  fsReset();
  const art = Q.get('art');
  if (art) {
    const fn = { sign: artSign, tract: artTract, saved: artSaveTract, bike: () => { cls(LGR, K0); pbClear(); for (let x = 0; x < 80; x++) pbPix(x, 39, DGR); drawBike(8, 12, { rot: 0.6 }); pbBlit(48); } }[art];
    if (art === 'road' || art === 'ride') { RIDE.run({ src: 'ghost', auto: true, roadMs: 60000 }); requestAnimationFrame(loop); return; }
    BASE = { name: 'art', draw() { cls(); if (fn) fn(); else if (window['art_' + art]) window['art_' + art](); } };
    requestAnimationFrame(loop);
    return;
  }
  const prog = Q.get('run');                 // ?run=defrag|surface|whirl|ride — a set piece in isolation, for building and filming
  if (prog) {
    fsReset();
    T.clear(); T.bot = 24; BASE = T; FX.off = false; palReset();
    const progs = {
      defrag: () => DEFRAG.run({ src: 'you' }), surface: () => SURFACE.run({ src: 'you' }),
      whirl: () => WHIRL.run({ src: 'you' }), ride: () => RIDE.run({ src: 'you' }),
      rideauto: () => RIDE.run({ src: 'ghost', auto: true }),
      zzt: () => ZZT.run({ src: 'you' }), crash: () => CRASH.run({ src: 'you' }), harrow: () => HARROW.run({ src: Q.get('src') || 'you' }),
      advent: () => ADVENT.run({ src: 'you' }), term: () => TERM.run({ src: 'you' }), msd: () => MSD.run({ src: 'you' }), msav: () => MSAV.run({ src: Q.get('src') || 'you' }), qbasic: () => QB.run({ src: Q.get('src') || 'you', file: 'TOANDFRO.BAS' }), termauto: () => TERM.run({ src: 'ghost', auto: true }),
      tithe: () => TITHE.run({ src: Q.get('src') || 'you' }),
      print: () => PRINTER.run({ docs: (Q.get('pf') || 'BANNER').toUpperCase().split(',').map(n => ({ dir: 'C:\\CHURCH', name: n + '.TXT', full: 'C:\\CHURCH\\' + n + '.TXT' })), src: Q.get('src') || 'you' }),
    };
    requestAnimationFrame(loop);
    if (progs[prog]) progs[prog]();
    return;
  }
  if (typeof START === 'function') START();
  requestAnimationFrame(loop);
}
boot();
